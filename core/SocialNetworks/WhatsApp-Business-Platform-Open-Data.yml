title: WhatsApp Business Platform Open Data
homepage: https://github.com/procom-dev/whatsapp-open-data
category: SocialNetworks
description: A dated, sourced open dataset of the WhatsApp Business Platform in three parts. (1) Meta's per-message API rate card - 38 markets and regions in each of the 16 currencies Meta publishes, plus volume-tier thresholds and rates for marketing, utility and authentication. (2) Current WhatsApp product limits - group and community size, broadcast lists, message length, media and file sizes, forwarding, calls, linked devices and Business-app limits. (3) A change ledger of every recorded pricing change since 2019, with provenance and the figures before and after. Available as JSON (each file an envelope carrying its own licence, attribution, source and verification date) and CSV, plus a CORS-open API. A weekly job keeps the mirror in step with the source.
