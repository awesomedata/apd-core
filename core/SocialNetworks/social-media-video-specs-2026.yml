description: Upload specifications for 23 video formats on Instagram, TikTok, YouTube, Facebook, LinkedIn, Pinterest, Snapchat, Threads and X, as one table. Each row has aspect ratios, recommended and minimum resolution, minimum and maximum duration, maximum file size, file types, maximum frame rate, caption, title and hashtag limits, plus a note and the links to the sources it was taken from. A second table (14 rows) lists what changed between 2025 and 2026. Most values come from the platforms' own help centres and developer docs, the rest from named industry sources, and every source is marked as official or industry. Useful for media research, tooling that validates uploads, and comparisons between platforms.
