description: "Seven aggregate datasets measured with PlayerSells' own crawlers between August and October 2026: follower or subscriber counts at every percentile on X (Twitter), Bluesky, Telegram, TikTok, YouTube, Kick and Twitch; X engagement rate percentiles for 152,291 accounts by follower band, with 45 posting pattern effects measured within accounts; X views per follower by account size, Premium badge against no badge; Telegram views per subscriber for 139,115 channels by size band and niche; Telegram subscriber change by topic and starting size over 14,874 channels; Kick and Twitch share of concurrent viewing by category for one week, gambling categories flagged; and Kick and Twitch simulcasting with the split of viewers between the two platforms. Totals, shares and percentiles only, with no account lists or personal data. Each dataset folder has a README with every column, the method and the limitations. CSV."
