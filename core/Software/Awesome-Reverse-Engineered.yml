description: Index of 16,844 open-source GitHub projects that exist because someone reverse engineered a closed app, web API, device, protocol, file format, game or AI product. Each record has the repository name, URL, a one-line description, category and subcategory (20 categories, for example game decompilations, devices and IoT, unofficial API clients, file formats and online service revivals), GitHub stars, primary language, license, last push date, archived flag, topics and the date the project was added. A nightly GitHub Action refreshes the metadata and logs deleted repositories. A second file lists 131 products that their makers discontinued and the open-source projects that keep them working, with a source for each shutdown year. Useful for research on reverse engineering, interoperability, right to repair and software preservation.
