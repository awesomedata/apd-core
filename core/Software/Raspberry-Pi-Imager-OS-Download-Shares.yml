title: Raspberry Pi Imager OS Download Shares (2021-2026)
homepage: https://github.com/raspberry-tips/rpi-os-trends
category: Software
description: Time series of which operating systems people write to SD cards and SSDs with the official Raspberry Pi Imager, reconstructed from the public statistics page rpi-imager-stats.raspberrypi.com. That page only ever shows the current rolling 30-day window, so the history from October 2021 onwards was rebuilt from 104 Internet Archive captures and has been extended by a weekly scraper since May 2026 (94 dates up to November 2026). Three dimensions are recorded - operating system, host architecture of the computer running the Imager (not the bitness of the image), and Imager UI locale. Values are shares of Imager downloads, not of the installed base. The repository documents two pitfalls of the source - a table header without a tr wrapper that made an earlier parser silently drop the top-ranked OS, and a change in late 2023 when the source started reporting 64-bit Raspberry Pi OS separately, which shows up as a break in the series rather than a user trend. The scraper aborts when the OS shares sum to less than 80 percent.
