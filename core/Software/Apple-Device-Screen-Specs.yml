description: "Screen specs for 175 Apple devices released 2007-2026: 55 iPhone, 46 iPad, 36 Apple Watch and 7 iPod touch models, plus partial records for 29 Mac and 2 Apple Vision Pro models. Fields include diagonal size, pixel and point resolution, scale, PPI, aspect ratio and display type, taken from Apple Tech Specs pages and the Human Interface Guidelines, with source URLs on every record. Safe-area insets (56 devices in portrait, 33 in landscape) and unofficial display corner radii (103 devices) were measured in the Xcode 27.1 Simulator, because Apple does not publish them. Values Apple does not publish are left null and listed in a gaps report. JSON, minified JSON and CSV, with a JSON Schema. Data CC BY 4.0, code MIT."
