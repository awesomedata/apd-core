---
title: Clock Face Preference by Territory (12-hour vs 24-hour, Unicode CLDR 49)
homepage: https://github.com/33nyc/angel-number-clock-faces
category: Software
description: >-
  The default clock face (12-hour or 24-hour) for each of 251 territories,
  flattened from the Unicode CLDR 49 time-preference data into one CSV row per
  ISO 3166-1 territory, with a JSON copy that carries metadata and license.
  Each row also counts how many of a fixed set of 13 repeating-digit minutes
  (11:11, 2:22, 22:22 and the rest) that face writes with repeating digits,
  and which ones it does not, since a 12-hour face renders 21:21 as 9:21.
  Every number is enumerated from the full space of minutes, not sampled.
  Useful for localization checks and for reasoning about how many people see
  a 24-hour clock by default.
