title: AI Tools Radar - open-source AI projects picked by arsentev.ai, with daily snapshots after selection
homepage: https://doi.org/10.5281/zenodo.22730450
category: Software
description: Since June 2026 the arsentev.ai radar has been picking open-source AI projects from GitHub, Hugging Face and Hacker News and writing a review page for each one. This dataset keeps the picks, then keeps watching them. Edition 2026-09 has 590 projects selected between 2026-06-11 and 2026-09-30 (GitHub 479, Hugging Face 103, Hacker News 8). Next to them sit 20 days of daily API snapshots, 2026-09-12 to 2026-10-01. For repositories that means stars, forks, open issues, licence, last push and the archived flag; for models and spaces, likes, downloads and last-modified. A project that vanishes is not dropped. It stays in the sample with its status recorded, so the data does not drift toward survivors. At the last snapshot 13 of 487 repositories answered 404 and one was archived. 17.1% carried no licence or one GitHub could not recognise. Median star gain over the 20 days was 85, across 415 repositories. Every figure in stats.json is computed by the build script from the two CSV files. A new edition goes out on Zenodo on the 1st of each month under one concept DOI, which always resolves to the latest. Limits, plainly. It is a curated selection for people who build with AI coding tools and agents, not a random sample of GitHub. Values at selection are the ones recorded on the review page, and growth before 2026-09-12 is not observed. Disclosure - I run the radar and maintain this dataset.
