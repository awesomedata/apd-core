category: Software
description: Every remote Model Context Protocol (MCP) server listed in the official MCP Registry that answers without an API key, token or login. Each week a GitHub Action probes the registry's Streamable HTTP endpoints with exactly two requests, initialize and tools/list, and never calls a tool. The 2026-10-16 run tested 17,094 endpoints; 9,857 (58 %) returned a tool list without credentials, 5,236 asked for authentication and 2,001 did not work. Template copies are removed (same tool set more than 3 times, same description more than twice, at most 2 per domain), leaving 8,007 servers. Each row has the registry name, title, topic, endpoint URL, tool count, tool names, description, website and repository. Useful for research on the MCP ecosystem, agent tooling, API availability and for picking public servers to test clients against. The probe scripts are in the repository, so every run is reproducible.
