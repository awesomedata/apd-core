title: Everyversion - Version History, Download Links and Checksums of 442 Desktop Apps
homepage: https://github.com/cristiangguasch/everyversion
category: Software
description: Release history of 442 popular apps for Windows, macOS and Linux, built from the winget-pkgs, Homebrew Cask and Flathub catalogs and some publishers' own release feeds. One JSON record per app lists up to 100 versions per platform, and for each version every installer with its official download URL, file name, architecture and SHA-256 checksum, plus release date, license, publisher and category. Checksums of the latest installers are re-computed by downloading the files, and code signatures and VirusTotal results are recorded. Fields that the sources do not provide are left out rather than guessed. A JSON Schema describes the record format. The data is in the repository and also served as static JSON files with no key or login.
