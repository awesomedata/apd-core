description: Market-level figures for the 29 AI product markets tracked by FalcoScan, a maintained catalog of 7,000+ AI products. One row per market - active products, products recorded as shut down, average opportunity and saturation scores (0 to 100), the share of products that are likely thin wrappers over another company's model, counts of products labeled hot or rising, and a composite Market Heat score. Each product is checked before it counts, duplicates and rebrands are merged and operating status is verified, so shut-down counts are recorded rather than inferred. Figures are those published on each market page from data refreshed 2026-09-26. Column definitions are in the README and on the methodology page. Useful for research on AI market saturation, startup survival and where AI products cluster. CSV, no login.
