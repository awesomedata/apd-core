title: IPTV Device and Player Compatibility (Canada)
homepage: https://github.com/iptvcanadaneo/iptv-device-compatibility-canada
category: Software
description: Per-device table of IPTV player apps, documented login methods and installation routes. Fifteen records, one per device family sold or used in Canada (Fire TV on Vega OS and on Fire OS, Fire TV Edition TVs, Android TV / Google TV, Apple TV, iPhone and iPad, Samsung Tizen, LG webOS, VIDAA / Foxxum / Whale OS / Titan OS TVs, Roku, Formuler, MAG, BuzzTV, Windows, Mac). Each record lists the IPTV player apps whose developers or stores publish support for that platform, the login or playlist methods those apps document (M3U, Xtream Codes API, Stalker / Ministra portal, MAC-based upload), the documented installation route, the main platform limitation, the first-party source URLs (manufacturer and platform documentation, developer sites, official store listings) and a per-row last-verified date. Values are copied from first-party pages without rewording; reseller lists, press and forums are not used. Describes player software only, not services, channels or content. JSON and CSV, direct download, no login.
