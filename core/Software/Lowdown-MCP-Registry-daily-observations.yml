title: Lowdown MCP Registry daily observations (fixed sample of 10,000 remote servers, from 2026-10-06)
homepage: https://github.com/PetShopBros/lowdown-data
category: Software
description: Daily time series of what the official Model Context Protocol (MCP) Registry declares about servers and what is observed when they are contacted. Once a day a scanner sends exactly two JSON-RPC requests, initialize and tools/list, to the Streamable HTTP remotes of a fixed sample of Registry entries (2,000 from 2026-10-06, 5,000 from 2026-10-19, 10,000 from 2026-10-29; each cohort keeps every entry of the previous one, at most 3 entries per host). It never calls a tool and does not authenticate. Each row records HTTP status, how far the handshake got (reached_level 0, 1 or 2), latency, tool count, server version and hashes of tool schemas, descriptions and names, so changes in tool definitions can be traced day by day; the definitions themselves are not published. Separate files record daily changes in Registry declarations (from 2026-10-19) and monthly snapshots of all declarations. Archived days are written once and never rewritten; MANIFEST.csv lists every file with its row count and SHA-256. LIMITS. One probe per day from one network location (GitHub Actions); a timeout means not reachable from there at that moment, not downtime. 401 and 403 are recorded as observed, not as success or failure. Entries are Registry names, not operators, and the sample does not represent the whole Registry; stdio-only servers are not observed. No scores or rankings.
