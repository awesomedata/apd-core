description: 33,289 travel points of interest across 93 countries and about 1,360 cities, each with a Wikidata QID, WGS84 coordinates, names in 11 languages (en, fr, de, es, pt, it, hi, zh, cs, ja, ru), one of 50 category slugs, fame signals (Wikidata PageRank and sitelink count) and a guide URL per language. A place is included only if Audiala has published a guide page for it, so the set is curated but not exhaustive. It also carries an ML target, search_impressions_decile, the Google Web search impressions of each place's guide pages from July to September 2026 as a relative decile, for benchmarking visibility prediction from open features. Direct CSV and GeoJSON downloads, no login required.
