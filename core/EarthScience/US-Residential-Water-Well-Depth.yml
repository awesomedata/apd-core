description: Depth statistics for domestic water wells in 35 U.S. states and 2,062 counties, aggregated from 1,044,608 well completion reports and permits published by state agencies (2000 to 2025, ranges vary by state). Each row gives the report count and the 25th, 50th and 75th percentile total depth, plus median casing depth and yield where the state records them. Every state row lists the filters applied (domestic use, date range, depth outlier cuts and any state-specific limits) and the agency source it comes from. No owner names, addresses or well locations are included. CSV, archived on Zenodo with a DOI and mirrored on GitHub.
