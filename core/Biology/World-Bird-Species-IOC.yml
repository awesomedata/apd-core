title: World Bird Species (AviList v2026) with multilingual names and cross-database IDs
homepage: https://huggingface.co/datasets/yunfeichen/world-bird-species
category: Biology
description: One record for each of 11,011 bird species following the AviList v2026 global checklist (45 orders, 249 families); every species not flagged as extinct or possibly extinct is included, plus 43 flagged species kept from the earlier collection. Taxonomy, common names in up to 43 languages, Avibase/eBird/Wikidata/GBIF/iNaturalist IDs where available, ranges, subspecies, AVONET morphological and ecological traits, IUCN and CITES status, and a crosswalk from IOC 15.2. CSV and JSON. The source repository also includes an AI-generated illustration per species (CC BY 4.0) with its AI review score.
