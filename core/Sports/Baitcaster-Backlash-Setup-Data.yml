description: Six plain-text reference tables for baitcasting reel setup, published as diffable CSV and Markdown rather than locked inside a web page. Covers reel class to lure weight to mono/fluoro/braid line weight with gram and kilogram conversions; how line weight, brake clicks and expected distance shift as wind speed rises; a setup-to-line-choice decision table for four common baitcaster setups; and three Markdown guides on backlash diagnosis order, bird's nest grading and the difference between spool tension and brake. No login, no purchase; released under CC0 1.0.
