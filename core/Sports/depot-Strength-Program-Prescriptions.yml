description: What 101 strength-training programs prescribe, as data. The programs are the depot.fitness library and follow documented templates such as 5/3/1, 5x5, push/pull/legs and upper/lower. One row per program gives level, type, goals, equipment, length in weeks, training days per week, weekly prescribed sets and the progression note; one row per canonical exercise (484, spellings merged) gives how many programs use it and its typical sets, reps and rest; exercise-by-exercise prescriptions are included for the five programs that are free in full. 1,791 prescriptions over 390 training days in the 2026-10-13 snapshot. This describes what one library prescribes, not what people did, and is not a sample of all training programs. CSV and JSON, no login required.
