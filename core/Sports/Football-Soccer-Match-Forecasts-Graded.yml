description: 783 football (soccer) matches from 24 August to 3 November 2026, from 35 leagues in 24 countries plus the UEFA Champions League, one row per match. Each row has the date, country, league, home and away clubs, the result the CQ blind model (a forecasting model that never reads betting prices) picked before kickoff (home win, draw or away win), the chance it gave that result, and the actual result. One forecast per match (the last one published before kickoff), nothing re-run after the matches. No betting lines or model inputs. Matches are added 7 days after they are played.
