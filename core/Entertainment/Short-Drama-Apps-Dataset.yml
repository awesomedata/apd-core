title: Short Drama Apps Dataset (App Store and Google Play)
homepage: https://github.com/ezrocky/short-drama-apps-dataset
category: Entertainment
description: Store facts and aggregated user-review signals for short drama (vertical micro-drama) streaming apps such as ReelShort, DramaBox, ShortMax and FreeReels. One row per app with US App Store and Google Play ratings and rating counts, the Google Play install band, in-app prices from the App Store's top in-app purchases list, the share of a sample of recent user reviews that complain about billing, ads, paywalls and bugs or praise the shows (reviews labeled by theme automatically; only shares are published, no review text), and a data-based score with rank. Updated weekly, with a CSV snapshot kept for every month. Apple lists only the most popular in-app purchases, so the price range and the subscription flag describe that top list only.
