description: Dated readings taken from Valve's own public surfaces for large-scale tactical shooters, and the timeseries of those readings. Nine games are sampled inside one minute for Steam open-session counts; earlier readings are kept as dated rows rather than overwritten, and each row names the page it was first published on. Also holds the WARDOGS achievement list with Valve's global unlock share for each entry, base and Supporter Edition prices in eight Steam regions plus the region Valve returns no price for, the store language list with its interface, audio and subtitles flags, review counts per language, and the squad faction roster with the publisher document each name was read from. No figure is estimated, converted between currencies or joined to a third-party tracker.
