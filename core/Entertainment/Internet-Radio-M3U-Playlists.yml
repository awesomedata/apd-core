description: Weekly-rebuilt M3U playlists of internet radio stream URLs taken from the public-domain Radio Browser directory, one file per country (170) and per genre (60) plus a top-500 list. Each file holds up to the 300 most-voted stations that passed Radio Browser's latest stream check (lastcheckok=1), de-duplicated by stream URL; the 2026-10-12 snapshot covers 49,818 unique working stations. A machine-readable index.json lists every file with its station count. Stream URLs point to third-party broadcasters and are tested only by the directory's own check. No login required.
