title: GL-MT6000 Wi-Fi CSI 10-minute capture (80 MHz, 256 subcarriers)
homepage: https://doi.org/10.5281/zenodo.23434789
category: ComputerNetworks
description: >
  A 10-minute raw IEEE 802.11ax channel-state-information capture from a
  GL.iNet GL-MT6000 (MediaTek MT7986A + MT7976) running OpenWrt and mt76.
  The 5 GHz HE80 capture at channel 44 contains 57,293 chain records grouped
  into 7,609 closed measurements, with 256 complex subcarriers across
  2 Tx x 4 Rx chains. The archive provides eight checksummed binary parts,
  a manifest, reassembly and data-dictionary documentation, parser and
  analysis scripts, and explicit acquisition/privacy limits. It contains
  no labelled human-activity ground truth.
