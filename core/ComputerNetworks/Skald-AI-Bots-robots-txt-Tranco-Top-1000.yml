description: What the robots.txt files of the Tranco top 1,000 domains (list 56Z8N) say to 16 crawlers, fetched 23 October 2026 and parsed under RFC 9309. Covers AI training crawlers, AI search crawlers and user-triggered fetchers (GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, Claude-SearchBot, Claude-User, PerplexityBot, Perplexity-User, Google-Extended, CCBot, Bytespider, Applebot-Extended, Meta-ExternalAgent, Amazonbot, anthropic-ai) plus Googlebot as a baseline. Per domain and agent the status is blocked, partial, allowed or unknown, with the exact matching robots.txt lines and line numbers. Includes every saved response as served (762 files) with a SHA-256 manifest, the fetch log and the scripts. 527 of 1,000 domains returned a parseable file; the rest are marked unknown.
