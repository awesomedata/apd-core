description: robots.txt and llms.txt of 285 major websites (261 readable) checked against 14 AI user agents plus Googlebot as a control, split into training, AI search and user fetch agents. One CSV row per domain with site category, fetch status, allowed or blocked status for each agent at the homepage path, and llms.txt status. Finds that 35% of readable sites block at least one AI training crawler and 21% block at least one AI search crawler, with CCBot and Bytespider blocked most (28.7% each) and OAI-SearchBot least (11.5%).
