---
title: 'KSA E-Commerce Privacy Compliance Index: consent scan of 1,556 Saudi storefronts'
homepage: https://doi.org/10.5281/zenodo.23053713
category: ComputerNetworks
description: >-
  A client-side measurement of the homepages of 1,556 Saudi Arabian e-commerce
  storefronts (data aggregated 2026-09-07), recording whether a cookie consent
  banner is present, whether tracking scripts load before consent, and whether
  Google Consent Mode v2 is signalled. A headless browser (Puppeteer) loads each
  homepage once; 1,496 storefronts were scored 0-100 against PDPL and GDPR
  consent criteria and 60 scans were inconclusive. 1,065 of 1,556 storefronts
  (68%) loaded tracking before consent and 935 (60%) ran trackers or
  non-essential cookies with no consent banner. Published as aggregate tables
  only (one long-format CSV, 45 rows: summary, score distribution, findings,
  results by e-commerce platform, tracker prevalence); no store-level rows. The
  sample is drawn from the Common Crawl URL index (.sa domains and Salla/Zid
  hosted stores) plus a curated list, so it is not a random sample. Results
  describe observed technical behaviour and are not a legal determination.
