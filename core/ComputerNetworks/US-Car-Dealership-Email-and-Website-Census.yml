description: >-
  Aggregate tables from a 2026 census of US franchise car dealership domains
  collected from manufacturer dealer locators. Mail gateway table: DNS MX
  classification of 17,659 domains into receiving providers (Microsoft 365,
  Google Workspace, GoDaddy, Mimecast, Barracuda, Proofpoint and others),
  overall, by franchise brand and by state. Email authentication table: SPF
  presence and all-mechanism, DMARC presence and policy for the 8,032 domains
  that receive mail. Website technology table: platforms and technologies
  detected on 16,948 live dealer websites. Plus an index of 30 email
  statistics with unit and source for each. Aggregate counts and shares only;
  the underlying domain list is not published and nothing identifies a person.
