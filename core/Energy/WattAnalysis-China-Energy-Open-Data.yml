description: A public snapshot of China energy data compiled by WattAnalysis from primary sources, in 235 single-series CSV/JSON files with a data dictionary. It covers NEA industry statistics (installed capacity and generation by source, utilisation hours, grid and power investment, electricity consumption by sector), customs trade series for coal, gas, LNG and battery cells, 63 energy policy documents with 59 tracked measures, aggregated energy-storage tender series, and cross-source composite price series for cells and lithium carbonate. Statistical calibers are never spliced (NBS above-scale, NEA full-caliber and Customs full-coverage are kept as separate series; conflicting source values are recorded in parallel). The frozen November 2026 snapshot is archived on Zenodo under DOI 10.5281/zenodo.24519660; the live API at wattanalysis.com/data is updated monthly.
