description: >
  Daily snapshot of retail fuel prices in 171 countries, one row per country
  and grade (gasoline, premium gasoline, diesel, premium diesel, LPG, CNG,
  E85), kept exactly as published: local currency of each grade and local
  unit (liter, US gallon or imperial gallon). Prices are aggregated from
  official bulletins (EU Weekly Oil Bulletin and national regulators),
  government price portals and station networks; every country lists its
  sources. The same daily commit carries EUR exchange rates for 150+
  currencies (to convert with the same day's rate), a food cost index for
  92 countries and vanlife weather suitability scores for 164 countries.
  Yearly history files add one row set per day. CSV and JSON with a
  Frictionless datapackage.json. Collected daily since October 2026.
