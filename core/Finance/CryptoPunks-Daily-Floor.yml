title: CryptoPunks Daily Floor Price
homepage: https://github.com/punkprice-data/cryptopunks-floor
category: Finance
description: Daily floor price of CryptoPunks since 23 June 2017, one row per UTC day with no gaps, rebuilt by replaying every offer, sale, withdrawal and transfer event of the CryptoPunks marketplace contract. The floor is the lowest public ask open at the end of each UTC day; nothing is estimated or taken from an aggregator. Includes ETH and USD values, the punk offered at the floor, the count of open asks, and a companion series for the PunkStrategy (PNKSTR) token premium. CSV and JSON, updated daily, with a verification script against contract state and an independent SQL recomputation on Dune.
