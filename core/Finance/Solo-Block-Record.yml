title: The Solo Block Record
homepage: https://github.com/sololuckio/solo-block-record
category: Finance
description: Every solo-mined Bitcoin block found by a small or home miner that could be verified on-chain, across all public solo pools. One row per block with its height, date, pool, the hardware or hashrate the winner reported, network difficulty, total reward, a link to the block on mempool.space and a link to the source that reported it. The odds are recomputed the same way for every row from the difficulty at that height; where a winner never published a hashrate, the hashrate and the odds are left empty rather than guessed, and blocks inferred from the payout pattern rather than declared by the miner are marked as such. CSV and JSON with a Frictionless datapackage.json and a CITATION.cff, directly downloadable with no login, mirrored daily from the publisher's API.
