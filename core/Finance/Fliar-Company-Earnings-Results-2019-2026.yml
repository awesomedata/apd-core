description: Quarterly, half-year and full-year company results reported in business news, January 2019 to June 2026, with revenue, net income, EPS, revenue growth, beat/miss versus expectations, US$ conversions and the reporting sentence. The full data holds 225,779 results for 33,900 companies in 152 countries; each revenue or profit figure is checked against the sentence it was read from and blanked when the check fails. The open release is a fixed 25% sample of whole companies (56,464 results) as CSV and Parquet, with a report of findings and method. Direct download, no login. Licence CC BY-NC 4.0.
