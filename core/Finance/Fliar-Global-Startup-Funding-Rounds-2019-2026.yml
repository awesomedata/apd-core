description: Deal-level startup funding rounds worldwide, January 2019 to June 2026, extracted from business news and cleaned (repeated reports of one deal merged, recaps of past rounds dropped, every amount checked against the sentence it was read from). Columns include announced date, company, country, city, sector, stage, amount in US$, amount status, lead investor, investor count and the source article. The full data covers 80,911 rounds by 47,428 companies; the open release is a fixed 25% sample of whole companies (20,227 rounds) as CSV and Parquet, with a report of findings and method. Direct download, no login. Licence CC BY-NC 4.0.
