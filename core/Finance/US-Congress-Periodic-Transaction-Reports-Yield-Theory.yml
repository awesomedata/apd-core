description: Every machine-readable periodic transaction report filed by members of the US House (House Clerk) and Senate (Senate eFD) for 2025 and 2026, normalized into one table. Each row carries the member, reported owner (self, spouse, joint, dependent), ticker and asset, transaction type, transaction and filing dates, filing lag, the disclosed value range kept as a range, and the URL of the source filing. Image-only and paper filings are excluded rather than guessed. CSV and JSON, refreshed daily, no account needed.
