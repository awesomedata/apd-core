title: UCard Observer Crypto Card Dataset
homepage: https://github.com/liam1024-tech/awesome-crypto-cards
category: Finance
description: >-
  One profile per crypto or stablecoin payment card brand (205 in the
  October 2026 snapshot), published in Simplified Chinese. Fields cover
  issuing region and eligibility, KYC requirement (required, conditional,
  not stated, or verified none), card network and issuing entity where
  published, monthly, issuance, FX and ATM fees, cashback terms, Apple Pay
  and Google Pay support, and whether the product is running, winding down
  or closed. Every figure is tied to the official page it came from and the
  date it was last checked, and closed cards stay in as dated records
  instead of being deleted, so 13 of the 205 describe discontinued
  products. JSON and CSV in the repository, plus a changelog of fee and
  policy changes from 2023 onward and a card BIN directory. No login, no
  API key. Data under CC BY 4.0, code under MIT.
