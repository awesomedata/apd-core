description: Current US federal tax and retirement figures published as JSON. Covers federal income tax brackets and standard deductions, contribution limits and catch-ups for 401(k)/403(b)/457(b)/TSP, IRA, SIMPLE, HSA, HDHP and health FSA, Roth and traditional IRA deduction phase-outs, Saver's Credit thresholds, the Social Security wage base, COLA and both earnings tests, Medicare Part A/B/D premiums with full IRMAA tier tables, RMD applicable ages by birth year, and income tax rates for the states modelled. Every figure carries a citation to the IRS, SSA or CMS publication it came from and the date it was retrieved. Directly downloadable over HTTPS with no login, no API key and no registration. It is served with a wildcard Access-Control-Allow-Origin header, so browser-side cross-origin fetch works as well as server-side clients.
