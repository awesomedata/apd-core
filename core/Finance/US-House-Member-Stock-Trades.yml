description: Every trade disclosed by members of the US House of Representatives on their periodic transaction reports under the STOCK Act, read from the House Clerk's filings since 2015 (78,077 trades from 7,727 reports as of November 2026). One CSV of trades per year, each row linked to the filing's PDF, with the member, district and party, the owner (member, spouse, joint, dependent child), account, asset and ticker, transaction type, partial sale, trade and notification dates, amount band, capital-gains box and filing status (new or amended). filings.csv lists every report on the Clerk's roster with how many trades were read from it, or why none were. Trades read from scanned paper forms (22,429) are marked as such. Rebuilt daily. House only; Senate filings are not included.
