title: Sweepbase Crypto Cards Dataset
homepage: https://doi.org/10.5281/zenodo.20449847
category: Finance
description: >-
  One row per cryptocurrency debit or credit card that can be ordered
  (143 cards in the September 2026 release). 24 columns cover issuance
  and annual fees, FX fee, ATM and daily spending limits, cashback,
  yield on the card balance, custody model, card network, KYC, regions
  and countries where the card is available, mobile wallets, top-up
  assets and chains, and IBAN/SWIFT/SEPA rails. Values are taken from
  the issuers' own fee pages and terms. Several fields are prose rather
  than numbers, because issuers publish tiers and conditions, not a
  single rate. CSV and JSON with SHA-256 hashes, no login.
