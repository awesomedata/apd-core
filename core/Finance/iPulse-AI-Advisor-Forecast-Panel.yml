title: iPulse AI Advisor Forecast Panel
homepage: https://github.com/TheFutureEdge/ipulse-ai-batch5-advisor-forecast-panel
category: Finance
description: >
  An anonymized, intentionally small panel of AI-generated financial forecasts
  for seven equity and crypto assets. Twelve advisor configurations per asset
  share one model family and frozen inputs. The June 2026 cohort contains
  1,680 quarterly forecast-path rows, 168 horizon-summary rows, 1,008 structured
  risk/driver rows, and 465 realized-price rows through August 24, 2026.
  CSV files, a data dictionary, methodology, limitations, and validation scripts
  support research on advisor disagreement and forecast evaluation. Most future
  horizons remain unresolved; this is not a representative market sample or
  evidence of investment performance.
