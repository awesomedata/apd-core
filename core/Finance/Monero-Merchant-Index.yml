description: >-
  One row per business or service that accepts Monero (XMR), about 1,800
  listings across 20 categories (exchanges, hosting, VPNs, shops, wallets,
  non-profits and more) and 100+ countries. Each listing is reviewed by hand
  and records its category, KYC policy, Tor (.onion) address, year of
  operation, country, 30-day uptime from automated checks, user rating and
  an A-F grade computed with a published method. Daily summary snapshots
  (totals, grade and KYC mix, Tor share, per-category and per-country
  counts) make it possible to follow changes over time. CSV and JSON,
  refreshed daily by a GitHub Action, no login.
