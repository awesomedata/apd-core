description: 7,426 probability forecasts by statistical models on Polymarket questions (weather, crypto, sports, markets, politics, tech), each next to the market price at the moment of the call, the resolved outcome, and the Brier score of both. Every call sits in a JSON file timestamped into Bitcoin with OpenTimestamps, so the time it existed can be checked independently. The first batch (14-26 September 2026, 1,613 calls) was sealed late and is flagged in a column. On resolved calls the market is more accurate than the models (Brier 0.161 vs 0.194).
