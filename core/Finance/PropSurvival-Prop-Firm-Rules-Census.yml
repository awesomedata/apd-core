description: Sourced, dated registry of published prop-trading-firm evaluation-program rules — profit targets, daily loss limits, drawdown mechanics, consistency rules, and payout terms — each field transcribed from the firm's own published documentation and periodically re-verified with a two-pass blind recheck. Covers 60 firm rule sets across 247 account-size configurations, computed from source via a deterministic corpus tool, never hand-typed. The bulk download carries identity, counts, dates and categorical rule shape only (no numeric daily-loss, drawdown, profit-split or fee values); those live on each firm's own page, linked per row. A companion GitHub repository shows five firms in full field-level detail plus tracking metadata for the rest. Data licensed CC BY 4.0.
