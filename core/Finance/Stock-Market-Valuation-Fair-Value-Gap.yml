description: Monthly snapshot of how far listed equities trade above or below a model-based fair value estimate, aggregated cap-weighted for the world market, per sector and per country, plus lists of the most undervalued and overvalued stocks and of likely value traps with upside, quality score and evidence level. Fair value per stock is estimated from several valuation models on reported fundamentals for about 35,000 stocks; the method and its limits are documented. CSV and JSON files, CC BY 4.0, archived with a DOI. Model estimates, not prices or investment advice; a monthly snapshot, not a live feed.
