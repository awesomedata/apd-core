title: AI-Blockchain Project-Card Dataset (ABPC)
homepage: https://doi.org/10.5281/zenodo.22800707
category: Finance
description: >-
  Structured cards for 845 AI-branded crypto projects in which every cited source
  is linked to the field it supports and tagged with a provenance tier: Tier-1
  (the project's own documentation, code and on-chain sources), Tier-2
  (aggregators) or Tier-3 (third-party media). The February 2026 snapshot holds
  4,371 evidence entries (3,707 Tier-1), Internet Archive copies for 84.5% of
  cited sources, and 463 negative-evidence rows recording claims for which no
  primary source was found. Each record has a passport (category, chain, type,
  token type, AI component, use case, launch date) with canonical values and the
  curator's original wording, canonical URLs for fifteen link types, the evidence
  table and evidence gaps. All 845 records validate against the published JSON
  Schema. Described in a peer-reviewed data descriptor in IEEE Data Descriptions
  (2026).
