description: >-
  Open dataset scoring 502 Spanish occupations (CNO-11, mapped to ISCO-08) by
  exposure to generative AI. It combines the ILO global exposure index, usage
  data from the Anthropic Economic Index and employment from the INE Labour
  Force Survey (EPA, 2011-2025). Task descriptions are translated to Spanish.
  Three CSV files: occupations with exposure scores, ILO tasks with scores,
  and employment by occupational subgroup.
