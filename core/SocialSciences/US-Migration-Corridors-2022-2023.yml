title: US Migration Corridors 2022-2023

homepage: https://doi.org/10.5281/zenodo.24297049

category: SocialSciences

description: All 2,544 interstate migration corridors in the IRS Statistics of Income 2022-2023 data, with households and people moved and the total and average adjusted gross income (AGI) each corridor carried, plus netted two-way corridor pairs and top-25 rankings. New York to Florida is the largest money corridor at $5.75 billion in total AGI moved, and Illinois to Florida movers carry the highest average income at $223,120 per household. CSV download, no login required.

