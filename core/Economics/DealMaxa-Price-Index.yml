title: DealMaxa Price Index
homepage: https://dealmaxa.com/en/tools
category: Economics
description: An open dataset tracking daily consumer-electronics prices from AliExpress
  and Amazon affiliate listings, normalised to a base of 100 on each product's first
  tracked day. Each daily snapshot covers 418 tracked products across roughly 52
  categories, priced in EUR, and is published as a rolling 90-day time series. The
  release includes an aggregate daily index, a per-category index, a per-product
  long-format price series, and a product dimension table. Delivered as CSV and JSON,
  downloadable without login, and refreshed daily.
