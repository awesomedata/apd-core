description: Counts, by category, of how many early-stage AI agent startups publish a price before a buyer speaks to sales. 106 companies were sampled and 88 could be read on October 20, 2026, across 19 categories. Columns cover whether a pricing page exists, whether any paid price is shown, whether a quote-only plan exists, whether an enterprise price is shown, free tier or trial, and SOC 2 and ISO 27001 statements. Totals only; company-level data is withheld. The sample leans toward accelerator-backed startups and is not a random sample of the AI agent market. Re-read monthly on the same companies. Archived on Zenodo with a DOI.
