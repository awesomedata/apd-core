description: Largest open-source bilingual (Chinese-English) dataset of China-focused trade news, with trilingual (ZH+EN+AR) sample in v2. 16,996 curated articles from HanseBrief with complete Chinese and English titles/summaries, plus 2,000 articles with Modern Standard Arabic translations. Covers 10+ categories (market, emerging tech, supply chain, metals, macro, agriculture, energy, policy, FX, China policy) and 30+ sources (Gelonghui, Yicai, 36Kr, AlJazeera, CNBC, FT, Caixin). Each article tagged with relevant commodities (hydrogen, steel, soybeans, oil, etc.). CC0 1.0 Public Domain. Useful for trade/finance machine translation (Chinese-English-Arabic), commodity market analysis, and China-MENA trade research.
