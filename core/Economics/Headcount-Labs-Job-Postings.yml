description: Open job postings collected from employers' own hiring systems (more than 100 applicant tracking systems, company careers pages and public government job exchanges). Copies of the same opening are linked to one job ID, and every posting keeps the fields the employer published plus a link to the original listing. The October 2026 snapshot holds 4,871,084 jobs, 5,716,621 postings, 5,583,156 job locations and 12,073 company summaries as Parquet, with daily change files. Job description text is not included. Only postings whose source terms allow redistribution are included.
