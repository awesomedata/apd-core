description: Daily readings for gold and macro markets with the source and reference period attached to every figure, covering COMEX and SHFE gold, US CPI and core PCE, non-farm payrolls, PPI, the dollar index, US 10Y/30Y Treasury yields, Brent and WTI crude, VIX, SPDR Gold Trust holdings, the federal funds target upper bound, Polymarket pricing of the next FOMC decision, and monthly central-bank net gold purchases on the IMF reporting-country basis. Published twice a day as a JSON snapshot (schema xaudaily.readings/v1) plus a one-row-per-day CSV history, together with a JSON Schema, a dependency-free Python client and the extraction scripts used to build them. When an upstream source fails its previous value is retained and flagged stale rather than estimated, and figures that cannot be traced to a named source are not published.
