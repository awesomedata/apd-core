category: Economics
description: Dated readings of the prices US telehealth programs publish on their own pages for GLP-1 medicines (compounded and brand semaglutide and tirzepatide), NAD+, sermorelin and glutathione. The 2026-11-12 snapshot has 130 price rows across 31 providers, each with the price and its basis (continuing, prepaid-effective, four-week or regular), any introductory or upfront price, commitment length, whether medication is included, the date checked and the provider page it was read from. A second file logs recorded changes since 2026-08-22 and a third counts how many tracked providers publish each fact. Coverage is the providers listed by the publisher, not a census of the market; a row is a dated reading, not a quote. The publisher earns commission from most of the providers it lists; the files carry no tracked links. Delivered as CSV with a Frictionless datapackage.json, downloadable without login.
