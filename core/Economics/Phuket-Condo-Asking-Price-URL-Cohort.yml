title: Phuket Condo Asking-Price Observation-Period URL Cohort
homepage: https://kvartiry-phuket.com/en/phuket-condo-prices/
category: Economics
description: >
  Aggregate statistics on advertised asking prices for Phuket condo
  sale listings, published as a cumulative, exact-URL-deduplicated cohort
  of listing URLs observed since 19 April 2026. The release is regenerated
  daily and the cohort keeps growing: the 2026-10-18 release covers 1,079
  listing-URL records observed from 2026-04-19 to 2026-10-18 (overall median asking
  price THB 3,770,000). The CSV and JSON report whole-unit asking-price
  medians and ranges by bedroom count and selected districts, budget-band
  counts and shares, bedroom-by-budget cross-tabs, the observation period,
  denominators, missing-area coverage and methodology. They contain
  aggregate rows rather than the underlying source URL rows. Asking prices
  are not registered transactions, valuations, current active inventory or
  a time-series trend, and URL deduplication does not prove distinct
  physical units. Downloads require no login or payment; every daily
  release also has an immutable, version-pinned copy linked from the
  homepage.
