---
title: VPS Hosting Price and Billing-Term Dataset
homepage: https://github.com/666break/vps-price-dataset
category: Economics
description: Published VPS hosting prices and the billing terms printed next to them, for 26 hosting providers, as CSV. Covers plan pricing with per-GB, per-vCPU and per-GB-storage unit prices, add-on costs (backups, snapshots, extra IPv4), first-term versus renewal prices with the renewal ratio, promotional offers with their conditions, datacenter-region price tables, contract-term totals, entry-tier hourly and monthly rates, payment methods as each provider page prints them, backup tier retention windows, included traffic allowances, disk extension costs, bandwidth overage units, and managed-database metering objects. Every row carries the official provider URL it was read from and the date it was checked. Where a provider does not publish a figure the cell says so, and where a page could not be read the row records the HTTP status instead of guessing. Ships with an offline checker that re-derives the file checksums and recomputes the per-unit arithmetic, and a CLI for querying the tables.
version: 1.0.0
