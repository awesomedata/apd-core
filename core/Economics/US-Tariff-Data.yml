description: >-
  Flat CSV and JSON copies of the US Harmonized Tariff Schedule (about 30,000
  coded lines at 4, 6, 8 and 10 digits, with general, special and column 2
  rates and the full description path of each line), the 382 chapter 99
  provisions that name a country (Section 301, 232 and 338, the forced-labor
  duty and the ended IEEPA and Section 122 measures, each marked in force or
  ended), and EU import duties for every HS subheading for all countries and
  15 major origins (89,000 rows), plus per-origin EU duty-free shares.
  Regenerated after each HTS revision. Direct download, no login.
