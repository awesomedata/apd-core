description: Mix-adjusted price index for U.S. home services (repair, installation and maintenance jobs), built from homeowner-reported project prices and published in three-year windows from 2014-2016 (= 100) through 2023-2025. Each window carries a 90% likely range and its report count, alongside overall inflation (CPI) and the government household-maintenance price index rebased to the same window for comparison. Ten category sub-indexes (roofing, plumbing, heating and cooling, electrical, pest control and others) are published only where they pass sample-size and interval-width gates. Every table downloads as CSV with no login or key; the page documents the method and its limits.
