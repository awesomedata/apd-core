title: Turkey Business Website Contact Channels
homepage: https://github.com/Pinlyx/turkey-website-contact-channels
category: Economics
description: "Which contact channels Turkish businesses offer on their websites, measured on a random sample of 5,014 business homepages fetched on 19 November 2026 (6,000 domains drawn from 256,184 reachable business domains in a Türkiye catalogue built from Overture Maps places, one record per domain, parked pages removed). Flags per site for WhatsApp chat links and plugins, around twenty live chat tools, Telegram, Messenger, social profile links, phone and email links, forms and contact pages. Summary by province and sector with sample sizes and 95% confidence intervals: WhatsApp on 38.9% of sites, live chat on 2.2%, no instant messaging channel on 59.9%. Includes an anonymised row file (no domains), the crawler and the analysis script. CSV, JSON and JSONL."
