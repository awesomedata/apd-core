description: Per-square-metre prices for professional carpet cleaning in Turkey, aggregated for 24 carpet types at national, province (81) and district (682) level, with the minimum, mean and maximum price and the number of companies behind each figure, plus company counts per province and district. Compiled in November 2026 from the price lists of 421 of the 4,561 carpet cleaning companies listed in a Turkish price comparison directory. Means are omitted where fewer than three companies publish a price, and prices exclude pick-up and delivery fees. The files hold aggregated figures only, with no company names or contact details. Five CSV files, archived on Zenodo with a DOI.
