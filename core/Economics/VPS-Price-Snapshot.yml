description: Published monthly and annual prices for virtual private server (VPS) plans, read directly from the public pricing pages of 15 hosting providers. 30 offers in this snapshot, each carrying the exact source URL it was read from and the UTC timestamp of the fetch. No price is estimated, interpolated, or filled in by hand; where a provider does not publish a machine-readable price the offer is listed without a price rather than guessed. The accompanying fetch-status table records the HTTP status and extraction method for every provider, including providers that returned nothing. Distributed as JSON and CSV. Covers consumer and small-business VPS plans only, not dedicated servers, shared hosting, or GPU instances. Currencies are not converted across USD and EUR; a separate price_monthly column normalises the billing cycle, not the currency.
