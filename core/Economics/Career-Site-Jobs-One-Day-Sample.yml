description: >-
  Every job posted on one day (November 5, 2026) by 5,033 employers on their own career sites, read directly from
  eight applicant tracking systems (Workday, Greenhouse, SmartRecruiters, Ashby, Lever, Recruitee, Workable,
  Personio) rather than from job boards, so there are no reposts or aggregator duplicates. 31,752 rows, one per
  posting, with title, company, location, ISO country, remote/hybrid/onsite when stated, seniority, job type,
  department, pay range when the employer's system has a pay field, the employer's posting time and the original
  job URL. 14,197 US postings, then India, UK, Canada, Germany, France and Australia. Known limits (pay present
  for ~2% of rows, workplace type often unstated, repeated openings) are documented in the README.
