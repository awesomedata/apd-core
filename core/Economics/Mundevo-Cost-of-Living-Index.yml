---
title: Mundevo Cost of Living Index
homepage: https://github.com/mundevo/mundevo-cost-of-living-index
category: Economics
description: >
  Cost-of-living index (New York = 100) and rent index for 104 cities in 49
  countries, computed from a fixed one-person monthly basket (new-lease
  one-bedroom rent, food, transport pass, electricity and heating,
  leisure, out-of-pocket healthcare). A second file gives, for every city and
  basket line, the publisher, source URL, reference period, method and an
  evidence tier (official, official-adjusted, contrasted, estimated) - 961 rows
  in all. Also includes the payroll-tax burden at the average wage (OECD Taxing
  Wages where available) and homicide rate, UHC service coverage and PM2.5 with
  the 0-100 indices derived from them. Rent sources are not official for 54
  cities; the card lists this and other limitations. Two CSV files, no signup.
