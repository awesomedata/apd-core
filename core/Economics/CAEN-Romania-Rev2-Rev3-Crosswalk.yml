category: Economics
description: Romania's official economic activity classification (CAEN, the national version of NACE) in machine-readable form. Full Rev.2 and Rev.3 structures with Romanian and English titles for every section, division, group and class, plus the 975-link Rev.2 to Rev.3 correspondence (one-to-one, splits, merges, many-to-many) and the 25 class numbers whose meaning changed between revisions. Built reproducibly from the INS correspondence table and structure PDFs and the Eurostat NACE files, which are kept in the repository with checksums. CSV and JSON, plus small Python and JavaScript packages.
