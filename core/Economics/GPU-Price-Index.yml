category: Economics
description: Daily snapshot of on-demand GPU rental prices (per GPU per hour) covering 22 GPU
  models across 26 cloud platforms, including 11 mainland-China providers that most price
  comparison sites do not cover. Prices are public list prices read from provider pricing pages
  or public APIs; every record carries a fetched_at timestamp so consumers can set their own
  staleness window. Published as JSON and CSV, refreshed every 45 minutes, also served by a
  free API that requires no key.
version: 2026.10.29
