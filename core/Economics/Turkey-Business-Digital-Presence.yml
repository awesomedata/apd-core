description: "Website, phone, email and social media presence for 1,786,700 businesses in Turkey, broken down by all 81 provinces and 40 sectors. Derived from the Overture Maps Foundation places dataset (CDLA-Permissive-2.0) filtered to Turkey, with provinces assigned by point-in-polygon against official boundaries because Overture's own address region field is null on roughly 92% of Turkish records. Every business with a website field was then requested once to test reachability: 684,496 records list a website but only 413,777 respond, so the national share with a working website is 23.2% rather than the 38.3% the field suggests. Social profiles were re-derived by reading the markup of the pages that answered. Includes the SQL query the figures come from. CSV and JSON."
