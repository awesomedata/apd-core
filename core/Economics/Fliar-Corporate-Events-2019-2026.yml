description: Company-level event reports extracted from business news, January 2019 to June 2026, typed as M&A (with acquirer or target role), contracts, lawsuits, layoffs, IPOs, asset acquisitions and announcements, with date, company, country, sector, headline and source article. The full data holds 1,339,579 event reports for 210,414 companies; the open release is a fixed 7% sample of whole companies (100,002 reports) as CSV and Parquet, with a report of findings, method and limitations. Counts are news reports, not unique transactions. Direct download, no login. Licence CC BY-NC 4.0.
