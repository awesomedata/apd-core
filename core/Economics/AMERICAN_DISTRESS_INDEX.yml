title: American Distress Index
homepage: https://americandefault.org/methodology/
category: Economics
description: Quarterly U.S. household financial distress composite and five domain
  scores. Public CSV and dated JSON releases document the historical normalization,
  sources, revisions and limitations; derived analysis is CC BY 4.0, with upstream
  source rights separate. The score is not a household prevalence estimate or a forecast.
