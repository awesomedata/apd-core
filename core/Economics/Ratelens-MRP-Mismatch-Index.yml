title: Ratelens MRP Mismatch Index (India)
homepage: https://github.com/OmegaMatrix/ratelens-mrp-mismatch-index
category: Economics
description: Monthly record of personal care products for which Amazon India and Flipkart show a different Maximum Retail Price (MRP) for the same model. Products are matched across the two platforms by manufacturer model code, multipacks are excluded, and each mismatch carries a confidence grade. Each edition is frozen on the last day of its month and never rewritten. The data shows that two declared MRPs cannot both be correct, but not which one is wrong or why.
