description: One row per occupation for 2,000 occupations in 38 industries, summarizing 25,000 everyday work tasks that generative AI can help with. For each occupation it gives the number of listed tasks and the share whose AI result is close to ready to use, that come up at least weekly, and whose result goes to someone else. Occupation names in English and Chinese. Task lists were drafted by AI from O*NET, ESCO and common regional work, reviewed by a second model and checked by script; figures are model-assisted estimates, not survey or measured results, and do not measure how much of a job AI could replace. CSV, UTF-8.
