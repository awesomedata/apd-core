description: Posted pay from job postings that state a salary, January 2024 to June 2026, deduplicated, annualised and converted to US$ per year with one stated exchange-rate table, with country, role family, seniority, industry group and skill tags. The full data holds 620,752 postings from 137,004 employers in 55 countries (56% in the United States); the open release is a fixed 16% sample of whole companies (100,060 postings) as CSV and Parquet, with salary-percentile tables by country, role and skill. Posted pay is an offer, not realised pay, and coverage is uneven by country. No job descriptions or recruiter details. Direct download, no login. Licence CC BY-NC 4.0.
