title: BestEOR Global Employment and EOR Provider Dataset
homepage: https://besteor.co/data
category: Economics
description: Two CSV and JSON datasets for cross-border hiring. The country file covers 139 countries, each with the statutory employer social-cost rate (0 to 42.5 percent of salary), 15 statutory employment terms (minimum wage, annual leave, public holidays, sick leave, maternity and paternity leave, weekly working hours, overtime premium, notice period, severance, probation cap, termination regime, thirteenth-month pay, payroll cycle, data-protection law) and macro context (GNI per capita, GDP per capita, population, unemployment). The provider file covers 63 employer-of-record vendors with pricing model, published monthly price where disclosed, price basis and a confidence flag. Every value carries its own primary-source URL (national governments, official gazettes, World Bank).
