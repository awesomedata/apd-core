description: "Aggregate statistics from a live crawl of more than one million job postings at about 12,600 employers, read directly from employer applicant tracking systems and career sites rather than aggregators, and refreshed as the crawl runs. Five datasets: how long postings stay open (Kaplan-Meier survival, rechecked daily), how often roles are taken down and relisted, how often postings state pay, how often they state a visa sponsorship position, and how many years of experience each seniority band asks for. Each is a JSON file with its method, sample and limitations documented on its report page."
