description: "How many local businesses list a website, region by region. 50,928,232 open places from Overture Maps (release 2026-11-18.0) in 15 countries (US, BR, DE, GB, FR, MX, ES, ID, TR, CA, RU, CH, AT, PT, LU), assigned by point-in-polygon to 294 first-level regions, Spanish provinces and French departements, and to 120 city districts in New York City, Toronto, Madrid, Istanbul and Izmir using the official district boundaries published by those cities. Shares of places with a website and with an Instagram profile, plus places and websites per 1,000 residents using official population tables from data.gv.at, opendata.swiss (BFS), datos.gob.es (INE), data.gouv.fr (INSEE), datos.madrid.es, NYC Open Data, City of Toronto Open Data and the Istanbul and Izmir open data portals. Example: Manhattan 102.9 business websites per 1,000 residents, the Bronx 16.2. CSV and JSON with the list of official sources and the DuckDB pipeline."
