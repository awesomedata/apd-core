title: Dubai Land Department Registered Property Prices
homepage: https://dubaidiligence.com/data
category: Economics
description: Registered residential sale prices and rents for every Dubai community, compiled from the Dubai Land Department transaction record. One row per community with 12-month and all-time registered sale counts, median price per square foot, gross rental yield computed from registered Ejari tenancy contracts against registered sale prices, and the off-plan share of sales. Figures are registered transactions rather than advertised asking prices, and cover homes only: land, whole buildings, offices, shops and hotel inventory are excluded, as are mortgage and gift registrations, which record a loan amount or a nominal figure rather than a price. The source portal requires a CAPTCHA for each query and offers no bulk download, so this is published as a single file instead. A monthly mix-adjusted house price index derived from the same record is published alongside it with its full method.
