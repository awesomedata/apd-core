description: A continuously-updated dataset of live Web3, crypto and blockchain job postings aggregated from company career pages and normalized into one clean schema (title, company, location, work mode, seniority, skills, salary, posting dates). A public sample of the 100 most recent active jobs is refreshed daily, alongside aggregate statistics (total counts, salary coverage, freshness). Each record links to the original posting and the hiring company. Useful for labor-market research on the crypto industry, salary benchmarking and building job tools. Available as JSON on GitHub, Hugging Face and Kaggle; full dataset and API available on request.
