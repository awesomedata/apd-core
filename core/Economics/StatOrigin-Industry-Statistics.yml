title: StatOrigin Industry Statistics
homepage: https://statorigin.org/
category: Economics
description: >-
  An open database of about 5,500 industry statistics across 22 industries,
  including electricity and gas utilities, pharmaceuticals, software, banking,
  retail, semiconductors, electric vehicles, steel and air transport. Each
  record carries the publishing organisation, the source document, the page or
  table locator, the verbatim sentence the value was taken from, and a link to
  the original document, so every figure can be checked against its primary
  source. Downloadable as CSV per industry, indicator or region, and through an
  unauthenticated JSON API with an OpenAPI 3.1 specification, under CC BY 4.0.
