title: BidProwl US Government Surplus Price Index
homepage: https://bidprowl.com/research
category: Economics
description: Monthly sold-price statistics from closed US government surplus auctions (GovDeals, GSA Auctions, Public Surplus, Purple Wave, HiBid and other federal, state and local sources). Two files, each as CSV and JSON. The price index gives the 25th percentile, median and 75th percentile final price by item category, state and month; cells with fewer than 3 sales are suppressed. The tracked-items file gives the monthly median and average final price for 111 commonly resold items such as forklifts, generators and mowers. Prices are in US cents. These are aggregates, not individual sales, and coverage is uneven. Nearly all rows are from 2024 onward, and categories and states with few auctions have few or no rows. Regenerated nightly.
