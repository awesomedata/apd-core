category: Economics
description: Prices for more than 120 LLM and AI API models from 13 providers (as of 2026-10-30), one record per model, with input, output, cached-input, cache-write and batch prices per 1M tokens, plus non-token rates such as OCR pages where a provider publishes them. Every record carries the official provider pricing page URL it was read from and a last_verified_at timestamp. The GitHub repository also holds per-provider price history, a JSONL log of dated price-change events, JSON Schemas and a methodology document. Available as JSON and CSV, mirrored on Hugging Face, with a fixed v1.1.0 release archived on Zenodo.
