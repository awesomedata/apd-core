description: A measured snapshot of the Gumroad digital-product long tail. 1,511 live listings sampled across 42 product categories in August 2026, each row carrying category, asking price, currency, rating count, subscription flag and product title. Rating count is used as a demand proxy - 33% of sampled listings have no ratings at all, and the share of rated listings ranges from 100% (VRChat avatars, Unity assets) down to 39% (crochet patterns, Excel dashboards). Useful for creator-economy research, digital-goods pricing analysis and long-tail marketplace studies. Full CSV, per-category summary JSON and the collector source are in the repository with no login or paywall.
