description: >-
  A maintained, source-linked collection of U.S. Federal Register notices from
  CBP, FMC, ITA, USITC, and USTR. Every record
  preserves the official notice and PDF URLs and maps the notice to operational
  evidence domains such as entry and compliance, ocean transport, trade
  remedies, tariff and classification, and market access. The repository
  provides direct JSON and CSV downloads, DCAT 3 catalogue metadata, CSVW field
  metadata, SHA-256 checksums, and a dated manifest showing the latest capture.
  The collection is kept current as relevant notices become available. No account
  is required.
