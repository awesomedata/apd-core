description: Derived CSV and JSON datasets covering skilled-trades labor supply, cost-adjusted wages, municipal building permit velocity, and commercial building stock across 366 US metropolitan statistical areas (MSAs), 51 states and DC, and 8 trade verticals (HVAC, plumbing, electrical, roofing, commercial construction, landscaping, painting, and structural steel). Combines BLS Occupational Employment and Wage Statistics (OEWS), Census County Business Patterns (CBP), BEA Regional Price Parities (RPP), FEMA National Structure Inventory (NSI, 9.08M commercial buildings), EIA CBECS, and 241,694 municipal building and specialty trade permits. All tables download directly as CSV and JSON with no login; archived on Zenodo under CC BY 4.0.
