title: Profitvana Global Fee Index
homepage: https://github.com/mustafa654/profitvana-fee-data
category: Economics
description: An open dataset of the published seller and payment fees of 31 online marketplaces and payment processors (Stripe, PayPal, Shopify, and Amazon's country marketplaces) across 17+ countries. Every rate is read from the provider's own official fee page and re-verified monthly, and each row carries the official source URL, the verification date, and notes on pricing edge cases; fields a provider does not publish openly are null rather than estimated. Covers domestic and international card rates, fixed per-transaction fees, currency-conversion spreads, marketplace referral fees, minimums and subscriptions. Served as JSON over a free no-key API, with a GitHub snapshot mirror.
