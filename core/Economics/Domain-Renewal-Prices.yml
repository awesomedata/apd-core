description: First-year registration and yearly renewal list prices in USD for 530 top-level domains, read from one registrar's public pricing endpoint (Porkbun) and limited to TLDs in the IANA root zone. Each row gives the TLD, the first-year price, the renewal price and the renewal-to-first-year ratio. In the 2026-09-27 snapshot, 304 of 530 TLDs renew at twice their first-year price or more and 172 at five times or more. These are one registrar's list prices on one date, not a market average; nothing is estimated or filled in by hand. Distributed as CSV and JSON, no login required.
