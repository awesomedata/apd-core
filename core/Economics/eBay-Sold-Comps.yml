description: 570 completed (sold) eBay listings across 9 secondhand collectible categories, as 15 CSV files. Each row carries title, sold price in USD, end date, condition, the search keyword that found it, and the eBay item id, so any row can be re-opened on eBay and checked. Categories are cast iron, CorningWare, Fiesta ware, Hot Wheels, Le Creuset, Pyrex, retro video games, sewing machines and sterling silver. eBay's own completed-sales view is behind a login, keeps roughly 90 days and cannot be exported, so realised secondhand prices are hard to obtain in the open. Shipping, seller and best-offer fields were dropped rather than published because they were unreliable or mostly null; METHOD.md states that and the other known biases, including that each file is the newest N sales for one keyword and is therefore a window of days, not a market history.
