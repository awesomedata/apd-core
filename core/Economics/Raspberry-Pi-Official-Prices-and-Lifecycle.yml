title: Raspberry Pi Official List Prices and Production Lifecycle (2012-2026)
homepage: https://github.com/raspberry-tips/rpi-prices-lifecycle
category: Economics
description: Every official US list price of Raspberry Pi boards, Compute Modules and Pico microcontrollers since the 2012 launch (134 price records), including the six memory-driven price rounds from October 2025 to November 2026, plus the production guarantees, end-of-life notices and last-time-buy dates of 45 Raspberry Pi products. Every row carries its primary source URL (raspberrypi.com announcements dated by their published time, official product briefs, obsolescence notices, archived product pages). Only manufacturer list prices are used, no shop or marketplace prices. A basis column states whether a price was named in the source, calculated from an announced increase, or an explicit assumption. Conflicts between official sources (for example two different production-until dates for the Raspberry Pi 5) are kept and documented rather than resolved. The JSON file adds price events, the history of extended guarantees and the US CPI-U series used for inflation adjustment. Useful for hardware pricing research, the DRAM price shock of 2025-2026, product lifecycle and obsolescence planning, and teaching with a small, fully sourced dataset.
