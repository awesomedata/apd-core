title: Bertrande AI API Price Registry
homepage: https://github.com/flotvif/ai-price-registry
category: Economics
description: Daily-read prices and limits of AI APIs (Anthropic, OpenAI, Google, DeepSeek, Mistral, OpenRouter, AWS Bedrock and about 20 other sources), 14,000+ published parameters for about 1,500 offers, read on each vendor's own pricing page or API since 2026-08-25. Every value carries its read date, source URL and the SHA-256 fingerprint of the source page; no value is produced by a language model, and a value that cannot be read stays empty. The repository is committed once a day with files sorted by parameter id, so its git history is the price history (git log -p values.csv); changes.csv lists every confirmed change with before, after and date. Announced future prices are recorded with their effective date. Snapshots are archived on Zenodo.
