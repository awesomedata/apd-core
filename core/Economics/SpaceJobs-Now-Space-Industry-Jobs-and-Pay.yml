description: Daily snapshot of the open jobs and internships at about 210 space companies and agencies (launch providers, satellite and spacecraft makers, NASA contractors, European space firms), read every night from each employer's own public careers site. Counts open roles by employer and by kind of work (propulsion, GNC, avionics, software, manufacturing, test and others), new roles in the last 7 days, and the median and typical range of posted annual pay per kind of work where at least three employers state a rate. About 21,800 open roles on 16 Nov 2026. Posted pay is what listings state, not earnings or a wage survey; coverage is the employers the board reads. JSON and CSV, no key.
