title: CoworkingView European Coworking Price Index
homepage: https://coworkingview.com/en/tools/price-index#price-index-downloads
category: Economics
description: Open dataset of flexible-office and coworking prices across 60 cities in Europe and the United Arab Emirates, aggregated from 417 listed workspaces of which 396 publish a price. Per city it provides the median, average, minimum and maximum monthly price per desk in that city's own currency, the sample size and property count, an entry-level price distribution, and a breakdown by product type (private office, dedicated desk, flexible desk, day pass, virtual office). A city is only published at a sample of five or more; thinner cities are returned flagged lowSample rather than silently averaged. Exposed as live JSON and CSV endpoints with no key or login, plus a history endpoint for previous snapshots. All data is CC BY 4.0.
