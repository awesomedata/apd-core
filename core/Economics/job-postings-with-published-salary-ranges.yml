---
title: Job Postings With Published Salary Ranges
homepage: https://github.com/sjdfi0wjvosdju9/job-salary-open-data
category: Economics
description: >-
  A global, per-posting dataset: 8,000+ live job postings from 266 companies across four ATS providers
  (Greenhouse, Lever, Ashby, Workable) where the employer published a pay range, normalised to annual USD and
  kept in the original currency too. One row per posting, with company, title, location, remote flag, role
  family, salary low/high/mid in local currency and in USD, posting date and the original job URL, so the data
  can be re-analysed rather than only read as aggregates. Regenerated weekly from the same company list, which
  makes week-over-week comparisons possible (for example which employers post pay and which never do).
