title: euroflation European inflation, interest rate and housing data
homepage: https://euroflation.com/data
category: Economics
description: Tidy CSV files of official European statistics for 30 countries, the euro area and the EU, from 1970. They cover harmonised inflation (HICP) with its components and index, ECB policy rates and the €STR, 10-year government bond yields and the spread over the German Bund, average bank rates on new household deposits and mortgages (ECB MIR), unemployment, growth, house prices and housing ratios, minimum wages, household electricity and gas prices, and weekly fuel prices. Compiled from Eurostat, the European Commission, the ECB and the OECD and refreshed daily. A Frictionless datapackage.json documents every column, and a single all.csv.gz holds everything. The compilation and derived series are CC BY 4.0; the official figures keep their publishers' reuse terms, which the page sets out.
