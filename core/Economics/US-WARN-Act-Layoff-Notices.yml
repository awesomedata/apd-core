title: US WARN Act Layoff Notices (normalized, daily-updated)
homepage: https://github.com/APProj/warn-act-notices
category: Economics
description: US WARN Act layoff notices from 29 state labor departments, normalized into one deduplicated schema (employer, canonical employer name, location, workers affected, notice date, layoff date) and refreshed daily. 40,000+ notices across the covered states; the free tier covers 2024-present with a 48-hour delay and includes per-state CSVs and a machine-readable monthly trend series (trends.json). Collected via the Apache-2.0 biglocalnews/warn-scraper plus an additional normalization, dedup and freshness layer. CSV and JSON, public, no login.
