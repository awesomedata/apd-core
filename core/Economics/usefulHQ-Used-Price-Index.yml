description: A daily index of secondhand consumer prices in the United States, built from the cheapest genuine used Buy It Now listing on eBay US for about 2,100 specific product models across 88 categories (graphics cards, phones, consoles, cameras, drones, instruments, tools and more). Each day is chained against the day before using a trimmed mean of per-model price ratios, and a one-day move of more than 25% on a single model is discarded as a changed listing rather than a price move. One row per day for the whole market and one per category. Fixed monthly readings are also published.
