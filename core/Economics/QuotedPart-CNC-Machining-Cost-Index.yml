description: Monthly cost estimates for a fixed basket of 26 CNC parts (3-axis and 5-axis milling, turning, Swiss turning, laser-cut sheet) plus 2 reference parts re-priced in 10 materials, each at quantities 1, 10, 100 and 1,000 (184 rows per edition). Every row gives unit and lot price, cost per part, the share of setup, run time, material and outside finishing, setup minutes per lot, run minutes per part and lead time. Figures are produced by one pricing engine at documented default US machine rates and material prices, so they are engine estimates, not a survey of shop quotes. Published by the maker of QuotedPart, a commercial quoting tool.
