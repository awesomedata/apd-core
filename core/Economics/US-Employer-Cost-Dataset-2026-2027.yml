description: Every official input behind the cost of a US employee on top of wages, for all 50 states, DC, 12 cities and the federal level. Covers Social Security, Medicare and FUTA (incl. credit-reduction states), state unemployment insurance (new-employer rates and wage bases, by industry where set), paid family and medical leave and disability shares, workers' compensation premium index, employer health premiums, paid sick leave mandates, and 2026 plus already-announced 2027 minimum wages. 827 values across 64 jurisdictions; each value carries its official source URL, publishing agency, effective date and last-verified date. CSV and JSON in long format with a Frictionless datapackage.json.
