description: A directory of 205 crypto debit, prepaid and credit cards, one row per brand, with KYC category, product status, issuer and card-network where published, fee fields, and a count of official source links. Every figure is linked to the issuer page it was read from and carries the date it was checked; fees a provider does not publish are left as unpublished rather than guessed, and discontinued products stay in the dataset as archived rows instead of being deleted. Published as CSV and JSON under CC BY 4.0, with a coverage report documenting what each column counts and what the dataset does not represent.
