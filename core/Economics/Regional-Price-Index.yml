description: Local list prices of digital subscriptions, games and devices (AI, streaming, productivity, cloud, Steam, Apple hardware) observed across 18 country storefronts and four checkout channels (iOS App Store, Google Play, direct web, Steam). Includes FX-converted USD, gift-card-adjusted landed cost, IMF PPP and work-hour affordability, and a per-row verification tier. Every row was observed on an official storefront or vendor page; storefronts that weren't observed are left out, not estimated. CSV, JSON and a Frictionless Data Package, released monthly with a Zenodo DOI (10.5281/zenodo.23959564), plus a free CORS JSON API.
