category: Economics
description: A collection of sourced US infrastructure datasets, one folder per dataset, each with CSV files, a data dictionary and a versioned Zenodo DOI. Data Center Electric Rates covers 105 utility filings and proceedings across 45 states on how data centers and other very large customers pay for power (large-load tariffs, data center rate classes, special contracts, rulemakings), with dockets, status, dates, customer protections and stated household bill impacts. Data Center Cost covers what it costs to build, lease and run a data center in North America in 2026 (cost per MW and per watt, lease rates, PUE and power cost, AI hardware prices, vacancy and timelines). Copper Retirement covers AT&T and Verizon FCC filings to discontinue copper landline (POTS) service by state, including the 1,060 AT&T wire centers where service can end from November 15, 2026. Every row links to its source document. New datasets are added as new folders in the same repository.
