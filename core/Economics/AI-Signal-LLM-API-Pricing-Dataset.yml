description: API prices of current large language models as each maker publishes them (85 models from 9 makers as of 2026-11-25; 81 with a per-token price, 4 checked to publish none), one row per model, with input, output and cached-input prices per 1M tokens in USD. Every row carries the maker's page it was read from (sourceUrl) and the day it was last verified (verifiedAt). A separate file logs price changes with their date and source (38 entries as of 2026-11-25, since 2026-09-01). Available as JSON and CSV, mirrored on Hugging Face, with releases archived on Zenodo.
