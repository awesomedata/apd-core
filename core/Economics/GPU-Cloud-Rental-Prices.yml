description: Public GPU rental prices (H100, H200, B200, B300, GB200, GB300, A100, L40S, MI300X, MI355X) from 25 cloud providers, normalized to USD per GPU-hour, with on-demand and spot rows kept separate. Every row carries the provider page it was read from, the date it was read, the fetch method (official API, static HTML or by hand), the price as originally listed and a confidence level. Multi-GPU node prices are divided by GPU count, and anything a provider does not publish stays blank rather than estimated. Daily history snapshots of the median price per GPU start 2026-11-04. Delivered as CSV and JSON, with mirrors on Hugging Face and Kaggle and a pandas starter notebook.
