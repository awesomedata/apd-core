description: Monthly asking prices of homes in Cyprus - Limassol, Paphos, Larnaca, Nicosia and Famagusta's free area - by type (apartment, villa) and bedroom count. The median, mean and middle half (25th-75th percentile) per square metre and per whole home, with the number of distinct offers behind each figure and the day it is of, and each month's change against the one before. Computed from public property adverts read daily from the portals index.cy and bazaraki.com, one home offered by several agencies counted once. These are asking prices, not transaction prices. A month once over is kept as first published; each new month is a new version of the Zenodo record. CSV with a README describing every column.
