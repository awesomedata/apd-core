description: Published plan prices for 39 B2B sales and outbound software tools (AI SDR agents, cold email, contact data and enrichment, email deliverability and warmup), one row per plan (129 plans). Each row has monthly and annual-billing USD prices, plan limits, billing notes, a free-plan flag, the vendor pricing URL it was read from and the date it was last checked. Prices a vendor does not publish are left blank (contact sales) rather than estimated. Pricing pages are re-fetched daily and dated raw snapshots plus a change log are kept in the repository, so plan and price changes can be tracked over time.
