title: Search Right Home Service Cost Index
homepage: https://github.com/Desmond711/searchright-cost-index
category: Economics
description: >-
  113 sourced U.S. household-service cost records across 22 trades (roofing, HVAC,
  plumbing, painting, flooring, fencing, decking, moving, auto repair, homeowners
  insurance and more), each carrying a figure, the publisher it came from, that
  publisher's own date, and the licence. Records are typed by figure kind so a figure
  can only be used for the claim it supports: 15 whole-job low-high ranges, 48 annual
  running costs, 9 worker hourly wages, 6 single averages, 2 state-average spreads,
  1 combined benchmark, 2 unit prices and 30 records that carry no dollar figure at
  all. The typing is the point — a per-square-foot rate or a worker's wage is published
  as such rather than dressed up as a price for a job. One JSON file, downloaded
  directly with no login, sign-up or key. CC BY 4.0 with per-record attribution.
