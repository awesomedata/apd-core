---
title: AI Video Model Free-Tier Observations
homepage: https://videofreetier.com/data/
category: MachineLearning
description: >-
  117 dated observations of what twelve AI video models grant on their free tiers, one row per figure.
  Each row carries the channel it was observed on, the date it was observed, and whether the source was
  a vendor statement or a report. Covered metrics include daily credit grants and daily generation caps
  per channel, sign-up bonuses and launch promotions, maximum single-clip length, extension ceilings,
  output resolution as stated by the vendor versus as advertised by hosts, watermark behaviour on free
  and paid tiers, API availability and error codes seen in practice, the measured credit cost of one
  generation, and product discontinuations. Where two observations disagree both are retained rather
  than averaged. Rows where nothing is published record the absence instead of a guess. No value is
  estimated or interpolated.
