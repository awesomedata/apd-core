---
title: Causal Chambers
homepage: https://github.com/juangamella/causal-chamber
category: MachineLearning
description: >-
  Real measurements from two computer-controlled physical devices, a wind
  tunnel and a light tunnel, collected under observational and interventional
  regimes, with a ground-truth causal graph for each device derived from its
  physics and empirically validated. Includes tabular sensor data and images,
  used as benchmarks for causal discovery, out-of-distribution generalization,
  change point detection, independent component analysis and symbolic
  regression. Direct download, no login.
keywords: causal inference, causal discovery, interventions, ground truth, benchmark, physical systems, sensor data
