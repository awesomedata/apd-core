title: Spring Prompt Business-Task LLM Benchmarks
homepage: https://huggingface.co/datasets/elliscrosby/springprompt-business-benchmarks
category: MachineLearning
description: >-
  Results for 47 language models from 20 developers on five benchmarks built
  from business work rather than exam questions: writing product listings
  from sparse feeds (CatalogBench), turning an analysis into a slide deck
  (DeckBench), planning and analysing a user survey (SurveyBench), running a
  simulated paid-marketing budget for twelve months (ROASBench) and timed
  chess against Stockfish where thinking time counts (BulletBench). One row
  per model, setting and measure, with the value, a 95% range where
  available, date observed, sample size, reasoning setting, serving provider
  and judge model. Also includes the public tasks for three benchmarks as
  JSON and a combined percentile score. CSV, direct download, no login.
