---
title: AI History Timeline
homepage: https://github.com/chronicle-ai-history/ai-history-timeline
category: MachineLearning
description: >-
  78 milestones in the history of artificial intelligence from 1943 to 2026,
  one row per event, from the McCulloch-Pitts neuron and the Turing test to
  current model releases and regulation. Each row has the date and how
  precisely it is known, the subject's common name, the person, lab or
  institution behind it, a category, a one-sentence summary and impact, the
  primary source (original paper, announcement or archive record) and the
  number of sources in the event's cited dossier (1,007 in total). Each event
  is also scored 0 to 100 under a published five-criterion rubric (conceptual
  shift, downstream influence, breadth, access, institutional change), with
  the five ratings kept as separate columns so the score can be recomputed or
  reweighted, plus a confidence level. CSV and JSON, direct download, no login.
