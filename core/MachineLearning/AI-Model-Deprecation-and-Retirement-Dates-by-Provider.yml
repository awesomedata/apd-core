category: MachineLearning
description: >-
  Every date quoted from the provider page that states it. 955 records covering
  919 AI API model IDs from lifecycle pages published by 20 companies:
  OpenAI, Anthropic, Google (Vertex AI, the Gemini Developer API, and the Agent
  Platform's open-model and partner-model schedules), Microsoft Azure/Foundry,
  AWS Bedrock, Together AI, Alibaba Cloud Model Studio, Mistral AI, Groq, IBM
  watsonx.ai, Oracle OCI Generative AI, Databricks, SambaNova, Nebius Token
  Factory, Cerebras, Cohere, xAI, DeepSeek, Moonshot AI and GitHub Copilot.
  Every record carries the source URL and the verbatim line from that page; a
  record also carries a shutdown date (922 of 943), a recommended replacement
  (531) and the date the deprecation was announced (291) where the provider
  states them, and is omitted rather than guessed where it does not. 76 model
  IDs have two or more providers publishing different shutdown dates for the
  same ID - grok-3 retires 2026-05-01 on Azure/Foundry and May 15, 2026 on
  xAI's own API - and those records show every version with its own source and
  quote rather than picking one. No single original exists; each provider
  publishes only its own page.
