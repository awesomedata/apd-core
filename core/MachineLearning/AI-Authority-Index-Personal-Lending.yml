category: MachineLearning
description: >-
  Which Australian personal lenders five AI engines (ChatGPT, Claude, Copilot,
  Gemini, and Perplexity) name, recommend, and caution against when asked the
  questions borrowers ask, read from 805 AI answers. One row per company the
  answers named (122 companies): 28 named often enough to be scored on five
  factors (Consensus, Reputation, Influence, Source, and Presence, each out of
  100, plus a composite score and a Star Chart cell), and 94 named too rarely
  to score, listed with the number of answers that named them. CSV, direct
  download, no login.
