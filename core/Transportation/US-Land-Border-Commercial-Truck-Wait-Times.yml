description: "U.S. Customs and Border Protection's Border Wait Times feed only ever shows the current wait. This archive keeps every reading posted for the commercial truck lanes (standard and FAST) at 53 U.S. land ports on the Mexican and Canadian borders, sampled every 30 minutes, with the number of lanes open and the time posted in each port's local time. A closed lane is left blank, never zero. Alongside the raw readings: 30-day average waits by port, weekday and hour, and every month of CBP's own published historical averages. CSV, no login or API key; updated daily."
