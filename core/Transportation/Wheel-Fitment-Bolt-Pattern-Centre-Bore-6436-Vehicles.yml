category: Transportation
description: Factory wheel-fitment specifications for 7,603 vehicle variants across 130 makes and 46 bolt patterns, model years 1940-2027. Each record carries bolt pattern (PCD), centre bore, lug count, OE wheel size and offset, plus reference aftermarket flush and maximum sizes, with a source URL per row. Direct CSV and JSON downloads, versioned on GitHub and archived on figshare with a DOI. Records are cross-checked against independent fitment references before publication; disagreements are held back rather than guessed (see the correction log in the repository README).
