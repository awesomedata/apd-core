description: Spec sheets for 1,150 FPV drone components (motors, propellers, LiPo and Li-ion packs, BNF quads, flight controller/ESC stacks, cameras and video transmitters), one table per type in CSV and JSON. Motor entries carry the manufacturer's own bench tables (current, RPM, thrust and efficiency per KV, prop, voltage and throttle step) for about 160 motors. Every entry lists the manufacturer or retail URL its specs were checked against; an entry missing a required field is held back instead of guessed. Regenerated daily from the site's build; tagged releases are archived on Zenodo with a DOI.
