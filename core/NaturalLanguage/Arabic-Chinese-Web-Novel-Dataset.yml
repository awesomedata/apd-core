title: Arabic-Chinese Web Novel Metadata Dataset
homepage: https://github.com/HeTaobaba123/arabic-chinese-novels-dataset
category: NaturalLanguage
description: Largest open-source Arabic-Chinese parallel metadata dataset for web novels. 7,476 Chinese web novels with complete 3-language metadata (Chinese, English, Arabic) covering 4.56 billion Chinese characters across 34 categories including modern romance, xianxia, cultivation, urban, wuxia, sci-fi. All novels have Arabic titles, 92% have Arabic descriptions. First dataset connecting Chinese web novel culture with the MENA region (400M+ Arabic speakers). Useful for low-resource machine translation, cross-cultural literary studies, recommendation systems, and MENA market research. CC0 1.0 Public Domain.
