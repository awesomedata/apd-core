title: Launches and the satellites they carried, 1957 to 2026
homepage: https://doi.org/10.5281/zenodo.23184904
category: Physics
description: >-
  Every orbital and suborbital launch since Sputnik (7,633, from Launch
  Library 2) and every payload in CelesTrak's satellite catalogue (27,900),
  each satellite linked to the launch that carried it by its COSPAR launch
  number. Launches have date, rocket, provider, site, pad, outcome, mission and
  orbit. Satellites have launch and decay dates, orbit, the country or
  organisation they are registered to, whether the US withholds the orbit, and
  who uses and runs them (from Jonathan McDowell's GCAT), with each operator
  rolled up to its parent organisation. Two CSV files with a data dictionary,
  rebuilt every week; monthly editions are new versions under the concept DOI.
