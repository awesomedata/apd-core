---
title: Planetary Retrograde Stations 1900-2050 (JPL DE421)
homepage: https://github.com/cazimi-live/retrograde-ephemeris
category: Physics
description: >-
  Computed minute-resolution UTC times of every retrograde and direct
  station, pre-shadow and post-shadow boundary and Sun conjunction or
  opposition for the eight planets from Mercury to Pluto (2024-2030), plus all
  476 Mercury retrograde cycles 1900-2050. Positions are apparent geocentric
  ecliptic longitude of date from NASA JPL DE421 via Skyfield; a station is
  the minute the longitude rate changes sign. JSON with field definitions,
  sidereal (Lahiri) longitudes, the generating script (MIT) and a CITATION.cff.
  Mercury stations are cross-checked against JPL Horizons.
