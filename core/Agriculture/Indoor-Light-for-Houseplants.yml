title: Indoor Light for Houseplants (meter readings, species light tiers, published figures)
homepage: https://github.com/ranson0318-dot/growspot-light-dataset
category: Agriculture
description: Three small CC BY 4.0 datasets about indoor light for houseplants. (1) Light-meter readings taken at real spots in real homes, published as per-band and per-environment quantiles rather than household-level rows. (2) The light requirement tier for each species in a houseplant care library, with the lux boundary between one tier and the next written down. (3) Figures and statements about houseplant light transcribed one at a time from published care guides, extension services and retailers, with units left exactly as each source writes them and the source URL on every row, so disagreement between sources can be counted. CSV and JSON, with a comment header carrying the snapshot date and attribution; versioned deposits on Zenodo.
