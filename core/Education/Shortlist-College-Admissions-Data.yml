description: >-
  Four CSV tables on U.S. college admissions and cost. Early decision admit rates
  next to overall admit rates for 97 colleges, from each college's own Common Data
  Set (2023-24 to 2025-26). Waitlist outcomes for 144 colleges (126 with a rate):
  spots offered, spots accepted and students admitted from the waitlist (CDS
  2024-25 and 2025-26). 194 four-year colleges whose average net price for
  families earning under $30,000 is below $10,000 a year, with graduation rates
  (College Scorecard, 2024-25). Early decision and early action deadlines and
  decision release dates for 127 rounds at 105 colleges, each row with its source
  URL and the date it was checked. Every row links to its source document. Ships
  with a column dictionary and datapackage.json.
