title: PURSUE Declassified UAP Files (structured index and page transcriptions)
homepage: https://github.com/tomasstankovic/uapinsight-pursue-dataset
category: Government
description: Structured index of every document the US Department of War has published under PURSUE (Presidential Unsealing and Reporting System for UAP Encounters) at war.gov/UFO - 478 documents from 11 agencies (FBI, CIA, NASA, Department of War, Department of Energy and others) across 7 releases, incidents from 1947 onward. Each document has the official metadata plus a structured record (summary, key findings, incident date and place, programs named, the conclusion the record itself states - explained, unresolved, under investigation or none - and the evidence it rests on). A separate file holds page-by-page transcriptions of 12,389 scanned pages. Transcriptions and analysis are machine-generated (Claude) from the official PDFs and are flagged as such; the source document link is kept for every row. CSV and JSONL, updated when a new release appears.
