description: Reference data on Türkiye's citizenship-by-investment programme under Turkish Citizenship Law No. 5901. Qualifying investment thresholds and the instrument behind each change since 2017, route conditions, government transaction costs, required documents, Hague Apostille status by country, and long-format statistics on citizenship acquisitions, foreign property purchases and 2026 enforcement action. Every figure names its source and an as-of date; figures no authority publishes are recorded as null rather than estimated, and sources.json indexes the primary instruments with a verification status per citation.
