title: Russian Business Inspections Registry (ERKNM)
homepage: https://kontragentpro.ru/data
category: Government
description: Aggregated statistics from the Unified Register of State Control (Supervision) Activities of the Prosecutor General's Office of the Russian Federation, covering 14.98 million inspection records from 2021 to 2027. Eight cross-sections are published as CSV - by year, by federal subject, by supervision type, by outcome, supervision types over time, outcomes over time, legal entities versus sole proprietors, and territorial structure of supervision types. The dataset separates enforcement activities from preventive ones, which is essential because Russian regulatory reform deliberately shifted volume toward prevention. Combining them into a single "inspections" figure inflates apparent enforcement almost tenfold. Documentation in Russian covers the caveats that determine which comparisons are valid - only 2022-2025 are complete years, since the register launched on 1 July 2021, the current year is unfinished, and records dated 2027 are scheduled future activities.
