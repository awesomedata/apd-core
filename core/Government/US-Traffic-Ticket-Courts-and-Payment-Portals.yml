description: >
  A machine-readable reference for what to do after a US traffic ticket: 54 city
  records and 21 state records. Each city record names the court or agency that
  actually handles the citation and links to that agency's own official payment or
  contest portal, plus the fine structure, the point consequences, typical contest
  options, and the items still unverified. Each state record covers the point system
  and whether a traffic course dismisses the case, withholds adjudication, only
  reduces points, or does not exist. No third-party payment services are listed.
