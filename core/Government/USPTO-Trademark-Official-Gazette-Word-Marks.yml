description: Every word mark published for opposition or registered in the weekly USPTO Trademark Official Gazette, parsed from the official ST.96 XML issues into one flat CSV (serial number, mark text, event, Gazette date, filing date, Nice classes, owner, USPTO status code). The Hugging Face mirror is a rolling ~120-day window refreshed after every Tuesday issue; a permanent immutable CSV per issue is kept on GitHub. Design-only marks (no verbal element) are excluded. CC0, no login, pandas / load_dataset ready. Source pipeline (stdlib Python) and a benchmarked name-similarity matcher are open source.
