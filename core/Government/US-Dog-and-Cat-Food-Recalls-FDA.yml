title: US Dog and Cat Food Recalls (FDA, 2012 onward)
homepage: https://github.com/perbowl/pet-food-recalls
category: Government
description: Every dog and cat food recall the US Food and Drug Administration has classified since June 2012, one row per recall event and one per recalled product, with initiated, classified and terminated dates, recall class, firm, reason category, species, lot codes for every product and barcodes (UPC/EAN) where FDA's product text gives them. Rows FDA files under veterinary products that were left out (animal drugs, livestock feed, food for other animals) are published with the reason, so the filter can be audited. Released monthly as CSV with a Frictionless datapackage.json and CITATION.cff.
