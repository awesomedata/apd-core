title: RemoteTaxCalc Income Tax Rates by Country
homepage: https://remotetaxcalc.com/tax-rates
category: Government
description: Statutory personal income tax rules for 27 countries (EU, UK, US, Canada, Latin America, Asia-Pacific, UAE) as one JSON file. For each country it gives the official brackets (including linear zones such as Germany's §32a formula), the allowance deducted before the brackets, tax credits, and a one-line basis stating what the brackets apply to, plus employee and self-employed social security contributions (rates, caps, tiers and fixed amounts), health contributions, and flat-tax regimes for contractors where they exist. Every country lists its source URLs (government publications and professional tax guides) and three dates — lastUpdated (when a value last changed), lastVerified (when it was last checked against the sources), and lastAnnouncementChecked (the year of the last government rate announcement compared against it). National-level rules for a single tax resident; US and Canada are federal only. No key, no rate limit, CORS open.
