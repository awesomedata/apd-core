description: Median property prices per square meter by French commune, derived from DVF (Demandes de Valeurs Foncières), the French tax administration's public record of actually registered real-estate sales (not asking prices or estimates). Covers several French départements, aggregated monthly at the commune level with sale volumes, median price for houses and apartments separately, and year-over-year evolution. Multi-unit mutations are excluded to avoid distorting the per-square-meter price. Published to support transparency on local housing markets.
