category: Government
description: VAT rates for all 27 EU member states mapped to the CN (goods) and CPA (services) commodity codes each rate applies to, with the member states' own legal notes verbatim. 2,667 commodity codes, 1,120 rate rows, 87 Annex III categories and 958 official comments. The European Commission publishes this mapping only through a SOAP service; this is the same content as JSON, one file per commodity code and one per member state, plus a daily change feed listing every rate change and code reclassification. Rebuilt daily by a scheduled job.
