category: Government
description: Monthly open dataset of public procurement notices (tenders, RFQs, RFPs, EOIs and grant calls) collected by FreeTender from official government e-procurement portals, public sector companies, development banks and UN agencies in 190+ countries. One gzipped CSV per month with 17 summary fields per notice — buyer, country (ISO 3166-1), region, city, sector, sub-sector, notice type, procurement type, publication date, closing date, stated value and currency (ISO 4217), source portal and the source's licence — plus a link to each notice. Over 1 million notices since August 2026 (about 440,000 in October 2026). Titles are in the original language. No contact details or full notice text. Also archived on Zenodo with a DOI and published on Kaggle.
