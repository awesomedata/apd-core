description: >
  Every cutoff the US Department of State printed in its monthly Visa Bulletin
  from June 2005 to the current month, one row per cell: bulletin month,
  employment or family preference, chart (final action or dates for filing),
  category, chargeability area, the cell exactly as printed, the parsed cutoff
  date, and whether the cell was a date, current (C) or unavailable (U).
  237 bulletins and 20,435 rows as of the October 2026 bulletin. Covers
  worldwide, China, India, Mexico and the Philippines. Employment final action
  cells start June 2005 and family cells April 2011; dates for filing cells
  start October 2015, the month State introduced that chart. 20 months in the
  span are not held, as the page says. Updated the day a new bulletin is read.
