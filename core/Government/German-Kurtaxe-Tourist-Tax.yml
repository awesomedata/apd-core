---
title: German Kurtaxe and tourist tax rates by municipality
homepage: https://github.com/keysethq/kurtaxe-daten
category: Government
description: >-
  Local tourist and spa taxes (Kurtaxe, Kurbeitrag, Gästebeitrag) and overnight
  stay taxes (Übernachtungsteuer) of more than 250 German municipalities, keyed
  by the official municipality code (AGS). Germany has no central source for
  these rates; every municipality sets them in its own statute. Each figure
  carries the verbatim wording of that statute, the source URL, the SHA-256
  checksum of the source document and the date it was checked. Includes
  seasons, child age bands, caps, exemptions, rates already adopted for a later
  date and the levy landlords pay themselves. JSON per municipality and for all
  of them, plus a CSV with one row per municipality and season; amounts in euro
  cents. Mirrored daily to GitHub, so the Git history is a change log of the
  rates.
version: v1
