title: Infusion Reimbursement Index (commercial contracted rates for infused drugs)
homepage: https://carecostestimate.com/infusion-index
category: Healthcare
description: What US commercial health insurers contract to pay for infused and injected (J-code) drugs, indexed to the Medicare Part B payment limit (100 = ASP + 6%). Built from the Transparency-in-Coverage machine-readable files published by 37 insurer filings (vintage 2026-Q2). Includes a per-drug reference table (806 HCPCS codes with median, low and high index across insurers and Part B spend), a 57-insurer scorecard, and a 37-filing fee-schedule census. Contracted rates, not paid claims. CSV, CC BY 4.0, with a Zenodo DOI.
