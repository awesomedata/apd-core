description: "Quebec's health ministry posts ER occupancy every hour but the file only ever holds the current hour, so we've been archiving it since August 10 2026 and rolling it up by week. One row per ER per week with average and peak stretcher occupancy, how many hours it sat at 100% or higher, average number waiting and present, average ambulatory and stretcher stay in hours, and patients there over 48 hours. There's also a province-wide file with one row per week. Partial weeks are dropped and the handful of ERs that never publish anything just have empty cells. The hourly data behind it is on GitHub if you want to redo the math."
