title: US GLP-1 Cash Prices by Drug, Dose and Seller (monthly)
homepage: https://doi.org/10.5281/zenodo.24481155
category: Healthcare
description: >-
  Monthly US self-pay (cash) prices for GLP-1 medicines (Zepbound, Wegovy pen
  and pill, Foundayo, Ozempic and Ozempic pill, Mounjaro, Trulicity, compounded
  semaglutide and tirzepatide) by dose and seller, across manufacturer
  pharmacies, retail pharmacies, telehealth programs and a government coupon.
  Each row gives the medicine price, required fees and the all-in monthly
  total, with the seller page it was read from and the check date. November
  2026 release: 298 rows, 25 sellers. Compounded drugs are not FDA-approved.
  CSV and JSON, no login.
