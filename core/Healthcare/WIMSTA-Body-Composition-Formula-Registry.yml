title: WIMSTA Body-Composition Formula Registry
homepage: https://wimsta.com/registry/
category: Healthcare
description: A machine-readable registry of 15 published body-composition and energy-expenditure formulas - body fat (Deurenberg, CUN-BAE, US Navy, RFM, Covert Bailey, Gallagher ranges), BMI (WHO, Trefethen), waist-to-height ratio (Ashwell), maximum heart rate (Fox, Tanaka, Gulati) and basal metabolic rate (Harris-Benedict 1919 and 1984 revision, Katch-McArdle). Each record gives the equation, coefficients, units, input ranges, sex coding, the derivation sample, reported error, limitations and the primary source, with notes on how the coefficients were verified against the original publication. One JSON file, open CORS, no authentication.
