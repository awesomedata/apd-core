title: WIMSTA Body-Composition Formula Registry
homepage: https://wimsta.com/registry/
category: Healthcare
description: A machine-readable registry of 26 published body-composition and energy-expenditure formulas - body fat (Deurenberg, CUN-BAE, US Navy, RFM, Covert Bailey, Gallagher ranges), BMI (WHO, Trefethen), waist-to-height ratio (Ashwell), maximum heart rate (Tanaka, Gulati, Fox, Nes, Londeree and Moeschberger, Inbar), basal metabolic rate (Mifflin-St Jeor, Harris-Benedict 1919 and 1984 revision, Katch-McArdle), ideal body weight (Devine, Robinson, Miller, Peterson) and body surface area (Mosteller, Du Bois, Haycock). Each record gives the equation, coefficients, units, input ranges, sex coding, the derivation sample, reported error, limitations and the primary source, with notes on how the coefficients were verified against the original publication. One JSON file, open CORS, no authentication. Archived on Zenodo (DOI 10.5281/zenodo.24588774), with test vectors and npm/PyPI packages (wimsta-formulas).
