title: KeepOkey Fall Alert Index — November 2026
homepage: https://doi.org/10.5281/zenodo.24417882
category: Healthcare
description: >-
  Published claims about US fall-alert devices and services, including call
  recipients, unanswered-call handling, prices, fees, contracts, returns and
  battery terms. Contains 1,121 provider-product-field claim records across
  22 fields and 31 provider entries. Records include source URLs, verbatim
  quotations and capture dates from 2026-11-20 to 2026-11-21. Official sources
  take priority; third-party exceptions are labelled. Documentary data,
  without sensor recordings or measured detection performance.
