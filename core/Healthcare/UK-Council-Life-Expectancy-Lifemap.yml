title: UK Council Life Expectancy and Healthy Life Expectancy (Lifemap)
homepage: https://lifemap.org.uk/data/
category: Healthcare
description: Life expectancy at birth and at 65 for all 380 UK councils (local authorities) in England, Scotland, Wales and Northern Ireland, and healthy life expectancy for the 216 upper-tier and single-tier councils, by sex, from the Office for National Statistics (2022-2024), with the ONS 95% confidence intervals. Trend series from 2001-2003 (life expectancy) and 2011-2013 (healthy life expectancy). Also five adult lifestyle measures (smoking, overweight or obese, physically active, five a day, drinking over 14 units a week) from OHID Fingertips for England and from the Scottish and Welsh national surveys; for England, the slope index of inequality in life expectancy and IMD 2025 deprivation scores; for England and Wales, ONS census-based healthy life expectancy (2019-2023), districts included. One CSV row per council with GSS area codes for joining, and a data dictionary; JSON with per-field source notes; long-form trend files; one JSON and CSV file per council. Figures not published for a council are left empty, never filled from a county or trust. Direct download, no login.
