description: Five machine-readable datasets on gambling harm and gambling recovery in the United States. Gambling Harm Index (51 rows, what every US state and DC publishes about gambling harm plus NCPG helpline contacts 2024-2025), Sportsbook Responsible-Gambling Tool Matrix (14 operators, which limits, cool-off, self-exclusion and account-closure tools each publishes, with a source URL per cell), Gambling Recovery Glossary (125 terms with stigma-preferred phrasing and sources), Quit-Gambling App Panel (107 iOS apps), and State and Multi-State Self-Exclusion Programs. Nothing estimated or imputed; every figure carries its source URL. Frictionless datapackage.json and a column dictionary per file.
