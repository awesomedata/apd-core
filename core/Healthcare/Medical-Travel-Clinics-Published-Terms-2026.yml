title: Published Terms of Medical-Travel Clinics 2026 (warranty, redo, aftercare)
homepage: https://github.com/BuGa/medtourism-published-terms-2026
category: Healthcare
description: >-
  What 684 clinics in 23 countries that sell treatment to international
  patients state on their own websites about four terms: warranty, who pays
  for a redo (revision policy), aftercare after the patient returns home, and
  the named treating doctor. Observed 21 September to 30 October 2026, from
  2,740 price observations. Counts of clinics that state, partly state or do
  not state each term, aggregated by treatment (14 treatments, e.g. dental
  implants, crowns and veneers, IVF, hair transplant, laser eye surgery) and by
  country, plus the share of clinics publishing a fixed price. Three small CSV
  files, direct download, no login.
