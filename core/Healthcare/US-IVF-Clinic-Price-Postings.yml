title: US IVF Clinic Price Postings
homepage: https://doi.org/10.5281/zenodo.23017008
category: Healthcare
description: A census of every US fertility clinic location in the CDC's assisted reproductive technology (ART) clinic data, recording whether the clinic's own website publishes a self-pay price for an IVF cycle. Where it does (about a third of locations), the row gives the amount, what the clinic says the price includes and excludes, and the clinic page it was read from; where it does not, the page that was checked. Every row carries the date it was read and the CDC clinic ID, so it joins to the CDC's ART success-rate and clinic-profile tables. Amounts are each clinic's own package and are neither averaged nor ranked. Released with a report that compares price posting with a 2019 review of SART member clinic websites.
