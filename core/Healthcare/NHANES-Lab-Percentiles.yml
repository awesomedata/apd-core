description: Survey-weighted percentiles for 479 blood and urine laboratory analytes measured in the US National Health and Nutrition Examination Survey (NHANES), 2011-2012 to August 2021-August 2023. Results by sex and age band, and for adults by race and Hispanic origin, for all examined participants and for a reference subset without common conditions. Each value comes with sample size, sum of weights and share below the limit of detection; the 2.5th, 50th and 97.5th percentiles carry design-based 95% confidence limits. CSV, with the code that produces it.
