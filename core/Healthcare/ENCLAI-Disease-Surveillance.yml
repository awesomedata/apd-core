description: Global infectious-disease outbreak surveillance records aggregated from official public-health publishers (WHO, ECDC, US CDC, national and sub-national agencies), normalised to a canonical disease vocabulary and ISO-3166-1 alpha-3 country codes, with reported case counts where the publishing agency states one. 209 diseases and pathogens; 225 countries and territories appear in the data, 86 with a direct national feed. Per-disease, per-country and disease-by-country pages, a weekly CSV briefing download, and a public API. Updated daily.
