title: US Online Menopause Treatment Prices
homepage: https://menocost.com/data
category: Healthcare
description: What US online menopause services charge for menopause hormone therapy (estradiol as a patch, gel, spray, pill or vaginal product, progesterone, combined products, compounded hormones, testosterone for women) and for the non-hormonal hot flash prescriptions (Veozah, Lynkuet, low-dose paroxetine), one row per price at about 75 services. Every price is read on the selling service's own page, in its own words, with the page it was read on, the day it was read and the last day a daily check still found it there; facts a page does not state are left empty. Each row gives the price for 30 days, any membership charged on top, what starting costs, and whether the service says it bills insurance or takes HSA and FSA cards. Companion tables give what US pharmacies pay per unit for the same medicines week by week (CMS NADAC), what Medicaid and Medicare drug plans paid by state (CMS), FDA label status (DailyMed) and the medicines on seven insurers' own drug lists.
