category: Healthcare
description: Open dataset of documented interactions between dietary supplement ingredients and medicines, plus some pairs with other substances, alcohol, food or laboratory tests. Each record gives the mechanism, a recommended course of action and a source (scientific publications, reference works or official drug documents). Many records include a verbatim quote from the official Summary of Product Characteristics or patient leaflet, with the section cited. Parts of the text were drafted with AI assistance, but every record is reviewed and signed off by a licensed pharmacist before publication. Content is in Polish; the column dictionary (in Polish) is in the README file of the record. Versioned snapshots on Zenodo; the DOI always resolves to the latest version. Not medical advice and not exhaustive.
