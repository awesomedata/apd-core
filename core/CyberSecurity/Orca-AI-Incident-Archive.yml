description: Open database of real-world AI agent security incidents, recorded month by month from January 2025 (365 records as of 2026-09-24, plus one 2024-12 precursor). One Markdown file per event with a YAML header, an attack-chain diagram and at least one clickable primary source; 625 unique source URLs in total and no record without a source. Three fields keep demonstrated attacks apart from actual damage - real_harm (confirmed victim or not; 133 records have one), ai_involvement (confirmed, disputed or unverified by the primary source) and kind (incident, vulnerability, research, report or policy). Records are tagged by attack type - indirect prompt injection, MCP, agent supply chain, credential theft, exfiltration, sandbox escape, destructive rogue agent actions, offensive agent use, agent-framework CVEs, evaluation breakout, and policy. Machine-readable JSON and CSV exports, checked against a JSON Schema in CI. Publicly disclosed events only, no exploit code.
