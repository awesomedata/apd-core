name: Deployment

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  validate-metadata:
    name: Validate metadata and check links
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            deploy/requirements.txt
            tests/requirements.txt

      - name: Install deploy dependencies
        run: pip install -r ./deploy/requirements.txt

      - name: Install test dependencies
        run: pip install -r ./tests/requirements.txt

      - name: Validate metadata
        run: bash ./tests/testing.sh

      - name: Render metadata and check links
        run: python ./deploy/render.py

      - name: Post link check summary to this run
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          report_path = "reports/latest.json"
          if not os.path.exists(report_path):
              print("No link report generated; skipping summary.")
              raise SystemExit(0)

          with open(report_path, newline="", encoding="utf-8") as f:
              rows = json.load(f)

          lines = ["## Link check report — {} failing link(s)".format(len(rows)), ""]
          if rows:
              lines.append("| Category | File | Homepage | Reason | What it means |")
              lines.append("|---|---|---|---|---|")
              for r in rows:
                  lines.append(
                      "| {} | {} | [{}]({}) | {} | {} |".format(
                          r["category"],
                          r["file"],
                          r["homepage"],
                          r["homepage"],
                          r["reason"],
                          r["description"],
                      )
                  )
          else:
              lines.append("All links passed. 🎉")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: Upload report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  deployment:
    name: Publish to awesome-public-datasets
    needs: validate-metadata
    if: ${{ needs.validate-metadata.result == 'success' }}
    runs-on: ubuntu-latest
    environment: deployment-key-pass
    timeout-minutes: 20
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Decrypt secrets
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          openssl aes-256-cbc -in .github/workflows/secrets/id_rsa.enc -out .github/workflows/secrets/id_rsa -pass pass:$ENCRYPTION_KEY -d -md sha1

      - name: Setup SSH agent
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          chmod 0600 .github/workflows/secrets/id_rsa
          ssh-add .github/workflows/secrets/id_rsa

      - name: Publish to awesome-public-datasets
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          git clone git@github.com:awesomedata/awesome-public-datasets.git
          bash ./deploy/deploy.sh

      - name: Cleanup
        if: always()
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          ssh-add -D || true
          rm -Rf *
