name: Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deployment:
    name: Publish to awesome-public-datasets
    runs-on: ubuntu-latest
    environment: deployment-key-pass
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r ./tests/requirements.txt

      - name: Validate metadata
        run: bash ./tests/testing.sh

      - name: Install render dependencies
        run: pip install -r ./deploy/requirements.txt

      # The nightly "Link Validation" workflow keeps the latest results on
      # the link-status branch. Use them for the README's OK / FIXME icons.
      # No network checks happen here, so this step is fast.
      - name: Load latest link status
        run: |
          if git fetch --depth 1 origin link-status 2>/dev/null; then
            git show FETCH_HEAD:link-status.json > deploy/link-status.json
            echo "Using link status from the link-status branch."
          else
            rm -f deploy/link-status.json
            echo "No link status yet; all links will show OK."
          fi

      - name: Render metadata
        run: python ./deploy/render.py

      - name: Decrypt secrets
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          openssl aes-256-cbc -in .github/workflows/secrets/id_rsa.enc -out .github/workflows/secrets/id_rsa -pass pass:$ENCRYPTION_KEY -d -md sha1

      - name: Setup SSH agent
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          chmod 0600 .github/workflows/secrets/id_rsa
          ssh-add .github/workflows/secrets/id_rsa

      - name: Publish to awesome-public-datasets
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          git clone git@github.com:awesomedata/awesome-public-datasets.git
          bash ./deploy/deploy.sh

      - name: Cleanup
        if: always()
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          ssh-add -D || true
          rm -Rf *
